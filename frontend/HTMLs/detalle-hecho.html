<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Hecho | METAmapa</title>
    <style>
        :root {
            font-size: 16px;
        }

        body {
            background-image: url('../fondoLevementeCargado.png');
            background-size: cover;                 /* Que cubra toda la pantalla */
            background-repeat: no-repeat;           /* Que no se repita */
            background-attachment: fixed;           /* Fijo */
            background-position: center center;     /* Que esté centrada */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #d9d9d9;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 70rem;
            width: 90%;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .titulo {
            font-size: 2rem;
            font-weight: bold;
        }

        .categoria {
            color: #444;
            font-weight: normal;
            margin-left: 1rem;
            font-size: 1.25rem;
        }

        .detalles {
            margin: 0.75rem 0;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .direccion {
            font-size: 1.125rem;
            margin-bottom: 1.25rem;
        }

        .imagenes {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .imagen {
            flex: 1;
            height: 9rem;
            background: #bdbcbc;
            border-radius: 0.5rem;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            transition: transform 0.3s ease;
        }
        .imagen:hover img {
            transform: scale(1.05);
        }

        .descripcion {
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .descripcion textarea {
            background: #bdbcbc;
            width: 98%;
            min-height: 10rem;
            border: none;
            border-radius: 0.5rem;
            padding: 1rem;
            font-size: 1.125rem;
            resize: vertical;
            font-family: inherit;
        }


        .editar {
            background: #333;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            float: right;
        }

        .editar:hover {
            background: #555;
        }

        .menu {
            font-size: 2rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            line-height: 1;
            transition: background 0.2s ease;
        }

        .menu:hover {
            background: #bdbcbc;
        }



        .flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            cursor: pointer;
            background: #fff;
            border-radius: 50%;
            padding: 0.5rem;
            user-select: none;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.2);
            transition: font-weight 0.2s ease, background 0.2s ease;
        }

        .flecha:hover {
            font-weight: bold;
            background: #bdbcbc;
        }


        .flecha.izquierda { left: -3rem; }
        .flecha.derecha { right: -3rem; }


        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: #000;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            display: block;
        }
        .close-modal {
            position: absolute;
            top: 0.25rem;
            right: 0.5rem;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            border-radius: 0.5rem;
            padding: 0 0.5rem;
            user-select: none;
            line-height: 1;
            transition: background 0.2s ease;
        }
        .close-modal:hover {
            background: rgba(255, 255, 255, 0.7);
            color: #000;
        }

    </style>
</head>
<body>

<div class="card">
    <span class="flecha izquierda">&#10094;</span>
    <span class="flecha derecha">&#10095;</span>

    <div class="header">
        <div>
            <span class="titulo">Título del Hecho</span>
            <span class="categoria">Caídas de aeronave</span>
            <div class="detalles">DD/MM/AAAA</div>
            <div class="direccion">Una Dirección 1234</div>
        </div>
        <div class="menu">⋮</div>
    </div>

    <div class="imagenes">
        <!-- Agregar src reales o de ejemplo -->
        <div class="imagen"><img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/Fire_inside_an_abandoned_convent_in_Massueville%2C_Quebec%2C_Canada.jpg" alt="Foto 1" /></div>
        <div class="imagen"><img src="https://via.placeholder.com/300x150?text=Foto+2" alt="Foto 2" /></div>
        <div class="imagen"><img src="https://via.placeholder.com/300x150?text=Foto+3" alt="Foto 3" /></div>
        <div class="imagen"><img src="https://via.placeholder.com/300x150?text=Foto+4" alt="Foto 4" /></div>
        <div class="imagen"><img src="https://via.placeholder.com/300x150?text=Foto+5" alt="Foto 5" /></div>
    </div>

    <div class="descripcion">
        <textarea placeholder="Escribe aquí la descripción..."></textarea>
    </div>


    <button class="editar">Editar</button>
</div>


<!-- Modal para imagen expandida -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">&times;</span>
        <img src="" alt="Imagen expandida" id="modalImage" />
    </div>
</div>
<script>
    // Seleccionar elementos relevantes
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const closeModalBtn = document.getElementById('closeModal');
    // Todas las imágenes pequeñas
    const imagenes = document.querySelectorAll('.imagen img');
    imagenes.forEach(img => {
        img.addEventListener('click', () => {
            modal.style.display = 'flex';
            modalImage.src = img.src;
            modalImage.alt = img.alt;
        });
    });
    // Cerrar modal al hacer clic en la X
    closeModalBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        modalImage.src = '';
        modalImage.alt = '';
    });
    // Cerrar modal al hacer clic fuera de la imagen
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            modalImage.src = '';
            modalImage.alt = '';
        }
    });
    // También se puede cerrar con la tecla ESC (opcional)
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.style.display === 'flex') {
            modal.style.display = 'none';
            modalImage.src = '';
            modalImage.alt = '';
        }
    });
</script>
</body>
</html>
