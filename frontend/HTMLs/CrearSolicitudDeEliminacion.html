<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CrearSolicitudDeEliminacion</title>
    <link rel="stylesheet" type="text/css" href="../style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image:url('../fondoLevementeCargado.png');
        }

        h1 {
            font-size: 2em;
            font-weight: bold;
            color: #444;
            margin: 20px;
        }

        .contenedor {
            background: var(--color-main);
            margin: 30px auto;
            padding: 20px;
            width: 80%;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: white;
        }

        textarea {
            width: 100%;
            height: 200px;
            resize: none;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 1em;
            font-family: Arial, sans-serif;
            background-color: #b0b0b0;
            color: #000;
        }

        .acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .min-char {
            font-size: 0.7em;
            color: #666;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .descartar {
            background-color: #b0b0b0;
            color: #000;
        }

        .enviar {
            background-color: #444;
            color: #fff;
        }
    </style>
</head>
<body>
<h1>Solicitud de eliminación</h1>
<div class="contenedor">
    <label for="descripcion">Descripción</label>
    <textarea id="descripcion"></textarea>
    <div class="acciones">
        <button class="descartar">Descartar</button>
        <span class="min-char">min 500c.</span>
        <button class="enviar">Enviar</button>
    </div>
</div>
</body>
</html>
