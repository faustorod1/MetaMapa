<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CrearSolicitudDeEliminacion</title>
    <link rel="stylesheet" type="text/css" href="../style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        html{
            height: 100%;
        }

        body {
            margin:0;
            font-family: Arial, sans-serif;
            height: 100%;
            width: 100%;
            background-image:url('../fondoLevementeCargado.png');
        }

        body h1 {
            font-size: 2em;
            font-weight: bold;
            color: black;
            margin: 20px;
        }

        .contenedor {
            background: var(--color-main);
            margin: 30px auto;
            padding: 20px;
            width: 80%;
            height: 85%;
            border-radius: 8px;
        }

        .contenedor-hecho{
            height: 15%;
            width: 100%;
            background: var(--color-secondary);
            border-radius: 8px;
        }

        .contenedor-hecho h1 {
            font-size: 1em;
            font-weight: bold;
            color: black;

            padding: 0.5em;
        }

        .contenedor-hecho h2{
            font-size: 0.8em;
            font-weight: normal;
            color: black;
            margin-bottom: 0.2em;
            margin-left: 2.5em;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: white;
        }

        textarea {
            height: 75%;
            width: 100%;
            resize: none;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 1em;
            font-family: Arial, sans-serif;
            background: var(--color-secondary);
            color: black;
        }

        .acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .min-char {
            font-size: 0.7em;
            color: lightgrey;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bolder;
            cursor: pointer;
        }

        .descartar {
            background:var(--color-accent-2);
            color: black;
        }

        .descartar:hover{
            background: var(--color-secondary-2-hover);
        }

        .enviar {
            background-color: var(--color-accent);
            color: black;
        }

        .enviar:hover{
            background: var(--color-main-hover);
        }
    </style>
</head>
<body>
<h1>Solicitud de eliminación</h1>
<div class="contenedor">
    <div class="contenedor-hecho">
        <h1>Titulo Hecho</h1>
        <h2>Descripcion Del Hecho</h2>
    </div>
    <label for="descripcion">Descripción</label>
    <textarea id="descripcion"></textarea>
    <div class="acciones">
        <button class="descartar">Descartar</button>
        <span class="min-char" id="contador">min 500c.</span>
        <button class="enviar">Enviar</button>
    </div>
</div>

<script>
    const textarea = document.getElementById("descripcion");
    const contador = document.getElementById("contador");
    const minChar = 500;

    textarea.addEventListener("input", () => {
        const restante = minChar - textarea.value.length;
        if (restante > 0) {
            contador.textContent = `min ${restante}c.`;
        } else {
            contador.textContent = "Listo ✅";
        }
    });
</script>
</body>
</html>
