<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cargar hecho | METAmapa</title>
    <link rel="stylesheet" type="text/css" href="../style.css">
    <link rel="stylesheet" type="text/css" href="../CSSs/cargarHecho.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>   <!--Para la flechita-->
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet"> <!--Para el logo-->
</head>

<body>
    <main>
        <a href="" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
        <div id="fixed-logo"></div>
        <form class="cargar-hecho-form" action="" method="POST"> <!--action: ¿a donde se enviarán los datos? method: metodo HTTP usado para mandar los datos -->
        <div class = "container">

                <h2 id="titulo-cargarHecho">Cargar Hecho</h2>
                <div class ="input-primerFila">
                    <div class="input-cargarHecho">
                        <h4>Título</h4>
                        <label for ="tituloHecho"></label>
                        <input type="text" id="tituloHecho" name="tituloHecho" required>
                    </div>

                    <div class="input-cargarHecho">
                        <h4>Categoria</h4>
                        <label for ="categoria"></label>
                        <input type="text" id="categoria"><!--categoria-->
                    </div>

                    <div class="input-cargarHecho">
                        <h4>Lugar</h4>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-magnifying-glass input-icon" id="input-icon"></i>
                            <input type="text" id="lugar" name="lugar">
                        </div>
                    </div>
                </div>

                <div class="input-cargarHecho">
                    <h4>Descripción</h4>
                    <label for ="descripcion"></label>
                    <textarea id="descripcion" placeholder="Escribe una descripcion..."></textarea><!--Descripcio-->
                </div>

                <div class="input-tercerFila">
                    <div class="input-cargarHecho">
                        <h4>Fecha</h4>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="input-cargarHecho">
                        <h4>Etiquetas</h4>
                        <input type="text" id="tagInput" class="tag-input" placeholder="Escribe una etiqueta...">
                        <button type="button" id="addTag" class="add-btn">➕</button>
                        <!-- contenedor visual -->
                        <div id="tagContainer" class="tag-container"></div>
                        <!-- input oculto con las etiquetas -->
                        <input type="hidden" name="tags" id="hiddenTags">
                    </div>
                </div>

            <div class="input-imagenes">
                <div class="input-cargarHecho">
                    <label for="fotos" class="custom-file">Sube imágenes📷 </label>
                    <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
                    <div id="preview"></div>
                </div>
            </div>

            <div class="button-footer">
            <button class="btn-submit" type="submit" >Cargar</button>
            </div>
        </div>
        </form>
    </main>

    <script>
        (() => {
            /*** CARGA DE FOTOS ***/
            const inputFotos = document.getElementById("fotos");
            const preview = document.getElementById("preview");
            let filesArray = [];

            function mostrarPreviews() {
                preview.innerHTML = "";
                filesArray.forEach((file, index) => {
                    if (file.type.startsWith("image/")) {
                        const reader = new FileReader();
                        reader.onload = e => {
                            const container = document.createElement("div");
                            container.classList.add("preview-item");

                            const img = document.createElement("img");
                            img.src = e.target.result;

                            const btn = document.createElement("button");
                            btn.textContent = "×";
                            btn.classList.add("remove-btn");
                            btn.onclick = (ev) => {
                                ev.preventDefault();
                                eliminarArchivo(index);
                            };

                            container.appendChild(img);
                            container.appendChild(btn);
                            preview.appendChild(container);
                        };
                        reader.readAsDataURL(file);
                    }
                });

                const dataTransfer = new DataTransfer();
                filesArray.forEach(file => dataTransfer.items.add(file));
                inputFotos.files = dataTransfer.files;
            }

            function eliminarArchivo(index) {
                filesArray.splice(index, 1);
                mostrarPreviews();
            }

            inputFotos.addEventListener("change", () => {
                const nuevosArchivos = Array.from(inputFotos.files);
                filesArray = filesArray.concat(nuevosArchivos);
                mostrarPreviews();
            });

            /*** ETIQUETAS ***/
            const inputTags = document.getElementById("tagInput");
            const addBtn = document.getElementById("addTag");
            const tagContainer = document.getElementById("tagContainer");
            const hiddenInput = document.getElementById("hiddenTags");
            let etiquetas = [];

            function actualizarHidden() {
                hiddenInput.value = etiquetas.join(",");
            }

            function crearEtiqueta(texto) {
                const tagText = texto.trim();
                if (!tagText || etiquetas.includes(tagText)) return;

                etiquetas.push(tagText);
                actualizarHidden();

                const tag = document.createElement("div");
                tag.classList.add("tag");
                tag.textContent = tagText;

                const btn = document.createElement("button");
                btn.textContent = "×";
                btn.onclick = (e) => {
                    e.preventDefault();
                    etiquetas = etiquetas.filter(et => et !== tagText);
                    actualizarHidden();
                    tag.remove();
                };

                tag.appendChild(btn);
                tagContainer.appendChild(tag);
                inputTags.value = "";
            }

            addBtn.addEventListener("click", () => crearEtiqueta(inputTags.value));
            inputTags.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    crearEtiqueta(inputTags.value);
                }
            });

        })();
    </script>
</body>
</html>
