<!DOCTYPE html>
<html lang="en">
<head>
    <title>Crear Colección | METAmapa</title>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        body{
            background-image: url('../fondoLevementeCargado.png');
            background-size: cover;                 /* Que cubra toda la pantalla */
            background-repeat: no-repeat;           /* Que no se repita */
            background-attachment: fixed;           /* Fijo */
            background-position: center center;     /* Que esté centrada */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container{
            background-color: var(--color-main);     /* CAMBIAR */
            border-radius: 1rem;
            padding: 0.8rem;
            padding-bottom: 0;
            width: 30vw;
            color: white;
        }

        .input-crearColeccion{
            padding: 0.3rem;
            margin: 0.5rem 0.2rem 0rem 0.5rem;
            text-align: left;
        }

        #tituloColeccion{
            border-radius: 0.3rem;
            border: 1px solid;
        }

        input[type=text]{
            border-radius: 0.3rem;
            width: 20vw;
            height: 4vh;
            padding: 0.2rem;
        }

        /* Estilos para el dropdown multiselección */
        .dropdown-multiselect {
            position: relative;
            width: 20vw;
            user-select: none;
        }

        .dropdown-multiselect button {
            width: 100%;
            border: 1px solid black;
            border-radius: 0.3rem;
            padding: 0.4rem;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-multiselect ul {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            background-color: white;
            color: black;
            border: 1px solid black;
            border-radius: 0.3rem;
            margin: 0;
            padding: 0.3rem 0;
            list-style: none;
            z-index: 10;
        }

        .dropdown-multiselect ul li {
            padding: 0.2rem 0.5rem;
        }

        .dropdown-multiselect ul li label {
            cursor: pointer;
            user-select: none;
        }

        .dropdown-multiselect ul li:hover {
            background-color: #a9a9a9;
        }

        select{
            width: 20vw;
            heigth: 0.5vh;
            padding: 0.4rem;
            min-height:2vh;
            border-radius: 0.3rem;
            border: 1px solid black;
            font-size:0.9rem;
            margin-top:0.1rem;
            cursor: pointer;
        }


        textarea{
            margin-top:0.2em;
            width: 100%;
            height: 7rem;
            margin-bottom:0;
            resize: none;
            border-radius: 0.3rem;
            padding: 0.3rem;
        }

        #input-descripcion{
            margin-right:5rem;
            margin-bottom: 0.5rem;
        }


        .footer-container{
            justify-content: flex-end;
            display: flex;
            padding:0;
            margin-top:0.2rem;
        }

        .btn-submit{
            font-size: 1.1rem;
            text-decoration: none;
            padding: 0.5em; /*em es una unidad relativa al tamaño de letra*/
            margin-bottom: 0.5rem;
            border-radius: 2em;
            color: black;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background-color: var(--color-main-2);
        }

        .btn-submit:hover {
            background-color: var(--color-main-2-hover);
        }

    </style>


</head>
<body>
<main>
    <!--Supongo que habría que (practicamente) duplicar esta página para "Editar coleccion" -->

    <div id="fixed-logo"></div>

    <form class="cargar-coleccion-form" action="" method="post" novalidate>
        <div class="container">
            <h2 id="titulo-cargarColeccion">Crear coleccion</h2>

            <div class="input-crearColeccion">
                <h4>Título</h4>
                <label for="tituloColeccion"></label>
                <input type="text" id="tituloColeccion" name="tituloColeccion" required oninvalid="this.setCustomValidity('Ingresa un título')" oninput="this.setCustomValidity('')">
            </div>

            <div class="input-crearColeccion">
                <h4>Fuentes</h4>
                <div class="dropdown-multiselect" tabindex="0">
                    <button type="button" id="dropdownBtn" aria-haspopup="listbox" aria-expanded="false">
                        Seleccione una o más fuentes
                        <i class="fa-solid fa-chevron-down" style="margin-left: 0.5rem;"></i>
                    </button>
                    <ul id="dropdownList" role="listbox" aria-multiselectable="true" hidden>
                        <li>
                            <label><input type="checkbox" name="fuentes[]" value="estatica"> Estática</label>
                        </li>
                        <li>
                            <label><input type="checkbox" name="fuentes[]" value="dinamica"> Dinámica</label>
                        </li>
                        <li>
                            <label><input type="checkbox" name="fuentes[]" value="proxy"> Proxy</label>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="input-crearColeccion">
                <h4>Algoritmo de consenso</h4>
                <select id="algoritmo" name="algoritmo" required oninvalid="this.setCustomValidity('Selecciona un algoritmo')" oninput="this.setCustomValidity('')">
                    <option value="" disabled selected>Selecciona un algoritmo</option>
                    <option value="multiples">Múltiples menciones </option>
                    <option value="mayoria">Mayoría simple</option>
                    <option value="absoluta">Absoluta</option>
                </select>
            </div>

            <div class="input-crearColeccion" id="input-descripcion">
                <h4>Descripción</h4>
                <label for ="descripcion"></label>
                <textarea id="descripcion" name="descripcion" placeholder="Escribe una descripcion..."></textarea>
            </div>

            <div class="footer-container">
                <button class="btn-submit" type="submit">Crear</button>
            </div>
        </div>
    </form>
</main>
<script>
    const dropdown = document.querySelector('.dropdown-multiselect');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const dropdownList = document.getElementById('dropdownList');
    const checkboxes = dropdownList.querySelectorAll('input[type="checkbox"]');
    const fuentesError = document.getElementById('fuentesError');

    // Función para crear el icono de flecha
    function createIcon() {
        const icon = document.createElement('i');
        icon.className = 'fa-solid fa-chevron-down';
        icon.style.marginLeft = '0.5rem';
        return icon;
    }

    // Actualiza el texto del botón según las opciones seleccionadas
    function updateButtonLabel() {
        const selected = Array.from(checkboxes)
            .filter(chk => chk.checked)
            .map(chk => chk.parentElement.textContent.trim());

        if (selected.length === 0) {
            dropdownBtn.textContent = 'Seleccione una o más fuentes';
            dropdownBtn.appendChild(createIcon());
            fuentesError.style.display = 'block';
        } else {
            dropdownBtn.textContent = selected.join(', ');
            dropdownBtn.appendChild(createIcon());
            fuentesError.style.display = 'none';
        }
    }

    // Mostrar/ocultar dropdown al hacer clic en el botón
    dropdownBtn.addEventListener('click', () => {
        const expanded = dropdownBtn.getAttribute('aria-expanded') === 'true';
        dropdownBtn.setAttribute('aria-expanded', String(!expanded));
        dropdownList.hidden = expanded;
    });

    // Cerrar dropdown al perder foco (click fuera)
    document.addEventListener('click', (event) => {
        if (!dropdown.contains(event.target)) {
            dropdownBtn.setAttribute('aria-expanded', 'false');
            dropdownList.hidden = true;
        }
    });

    // Actualizar etiqueta cuando cambian los checkboxes
    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', updateButtonLabel);
    });

    // Inicializar texto del botón
    updateButtonLabel();

    // Validación personalizada al enviar el formulario
    const form = document.querySelector('.cargar-coleccion-form');
    form.addEventListener('submit', (e) => {
        const anyChecked = Array.from(checkboxes).some(chk => chk.checked);
        if (!anyChecked) {
            e.preventDefault();
            fuentesError.style.display = 'block';
            dropdownBtn.focus();
        }
    });
</script>
</body>
</html>
