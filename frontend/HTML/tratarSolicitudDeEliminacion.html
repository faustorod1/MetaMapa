<!DOCTYPE html>
<html lang="en">
<head>
    <title> Tratar eliminación | METAmapa</title>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        body{
            background-image: url('../fondoLevementeCargado.png');
            background-size: cover;                 /* Que cubra toda la pantalla */
            background-repeat: no-repeat;           /* Que no se repita */
            background-attachment: fixed;           /* Fijo */
            background-position: center center;     /* Que esté centrada */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container{
            background-color: var(--color-main);
            color: white;
            border-radius: 1rem;
            padding: 0.2rem;
            width: 60vw;
        }

        .header-titulo{
            text-align: center;
            margin-bottom: 0.3rem;
            margin-top:0.3rem;
        }

        .container-data{
            padding: 0.3rem;
            margin: 0.1rem 0.2rem 0.1rem 0.5rem;
            text-align: left;
        }

        #container-data-2{
            margin-bottom:0.5rem;
            margin-top:0;
            border-bottom: 1px solid black;
        }

        textarea{
            margin-top:0.2em;
            background-color: white;
            width: 100%;
            height: 7rem;
            margin-bottom:0;
            padding: 0.3rem;
            resize: none;
            border-radius: 0.3rem;
            text-align: justify;
        }

        .btn-submit{
            font-size: 1.1rem;
            text-decoration: none;
            padding: 0.5em; /*em es una unidad relativa al tamaño de letra*/
            margin-bottom: 0.5rem;
            border-radius: 2em;
            color: black;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--color-main-2);
        }

        .btn-submit:hover {
            background-color: var(--color-main-2-hover);
        }

        .buttons-footer{
            margin: 0.2rem;
            justify-content: space-between;
            align-items: center;
            display: flex;
        }


        </style>


</head>
<body>

    <a href="" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
    <div id="fixed-logo"></div>

    <form class="tratarSolicitudDeEliminacion-form" action="" method="post">
    <div class="container">

        <div class="header-titulo">
            <h2>Solicitud de eliminación</h2>
        </div>


        <div class="container-data" id="container-data-2">
                <p><strong>Fecha</strong>: 24/08/2025</p>
                <p><strong>Solicitante</strong>: nombre_usuario</p>
        </div>

        <div class="container-data">
        <p><strong>Título</strong>: Ráfagas de más de 100 km/h causa estragos en San Vicente, Misiones</p>
        </div>

        <div class="container-data">
            <p><strong>Descripción:</strong></p>
        <textarea readonly id="descripcion">La región de San Vicente en Misiones sufrió los efectos de una intensa ráfagas de más de 100 km/h. El incidente obligando a evacuar a residentes de la zona. Se ha convocado al comité de crisis para coordinar las acciones de respuesta.</textarea>
        </div>

        <div class ="buttons-footer">
            <button class="btn-submit" type="submit">Rechazar</button>
            <button class="btn-submit" type="submit">Aprobar</button>
        </div>
        </div>

    </form>


</body>
</html>
