<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estadísticas | METAmapa</title>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="../style.css" />
    <link rel="stylesheet" type="text/css" href="../login-register.css" />
    <script src="../script.js"></script>
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-image: url('../fondoLevementeCargado.png');
            background-attachment: fixed;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            align-items: center;
            justify-content: center;
            display: flex;
        }

        .contenedor {
            background-color: var(--color-main);
            border-radius: 30px;
            opacity: 0.9;
            display: flex;
            width: 80vw;
            height: 85vh;
            margin: 3rem;
            flex-direction: column;
            justify-content: flex-start; /* título arriba */
            align-items: center;
            position: relative; /* para posicionar el botón dentro */
            padding: 2rem;
            box-sizing: border-box;
        }

        .contenedor h1 {
            color: white;
            font-family: 'Londrina Solid', cursive;
            font-size: 2rem;
            margin: 0 0 2rem 0; /* espacio abajo */
            width: 100%;
            text-align: center;
        }

        /* Contenedor para centrar el gráfico */
        .grafico-contenedor {
            display: flex;
            position: relative;
            flex-grow: 1; /* ocupa espacio restante */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding-bottom:6rem;
            width: 100%;
        }

        button.descargar-csv {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            background: var(--color-main-2);
            color: black;
            border: none;
            border-radius: 12px;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Londrina Solid', cursive;
            transition: background-color 0.3s ease;
        }

        button.descargar-csv:hover {
            background-color: var(--color-main-2-hover);
        }


       .grafico {
            position: relative;  /* para colocarla sobre el canvas */
            top: 10px;
            left: 10px;
            width: 30rem;       /* ajusta tamaño */
            height: auto;
            z-index: 10;        /* para que esté encima del canvas */
           border: 0.1rem solid black;
        }

    </style>
</head>

<body>

<div id="fixed-logo"></div>

<div class="contenedor">
    <h1>Estadísticas</h1>

    <div class="grafico-contenedor">
        <img src="../grafico_rosquilla_2.png" class="grafico">
    </div>

    <button class="descargar-csv">Descargar csv</button>
</div>


</body>
</html>
