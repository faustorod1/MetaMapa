<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        html {
            height: 100%;
        }
        body {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .btn-add {
            border-radius: 2em;
            font-size: 2rem;
            font-weight: 900;
            background: var(--color-accent);
            color: white;
            width: 2em;
            height: 2em;
            aspect-ratio: 1;
            border: none;
            outline: none;
            cursor: pointer;
        }
        .btn-add:hover {
            background-color: var(--color-accent-hover);
        }
        #btn-add {
            position: fixed;
            right: 4rem;
            bottom: 2rem;
        }

        .search-bar {
            display: flex;
            background: var(--color-secondary);
            position: fixed;
            width: 50%;
            top: 1em;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1rem;
            margin-left: 0.5rem;
        }
    </style>

</head>
<body>
<iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.2188434592763!2d-58.42269192458701!3d-34.59862725722876!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bccb2e1493a6a3%3A0x1862a7c0b8163e5d!2sUTN.BA!5e0!3m2!1ses-419!2sar!4v1755606999095!5m2!1ses-419!2sar"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
</iframe>
<button class="btn-add" id="btn-add">
    <i class="fa-solid fa-plus"></i>
</button>
<div class="search-bar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Buscar...">
</div>
</body>
</html>
