<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mapa</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        html {
            height: 100%;
        }
        body {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }
        button {
            border: none;
            outline: none;
            cursor: pointer;
        }

        #hecho-preview {
            position: relative;
            height: 100%;
            background-color: var(--color-secondary);
            transition: 0.3s ease-in-out;
            transform-origin: 0;
            padding-top: 1.5em;

            flex: 0;
            min-width: 0;
        }
        #hecho-preview.active {
            transition: 0.3s cubic-bezier(.74,.18,.25,1.55);
            flex: 1;
            min-width: 15vw;
        }
        #hecho-preview > .btn-close {
            position: absolute;
            right: 0.5em;
            top: 0.5em;
            width: 1em;
            background: none;
            font-size: larger;
        }
        #hecho-preview > .data-container {
            width: 100%;
            height: 100%;
            padding: 0.5em;
            flex-direction: column;
            
            display: none;
        }
        #hecho-preview.active > .data-container {
            display: flex;
        }
        #hecho-preview__title {
            text-align: center;
            overflow: hidden;
        }
        
        main {
            flex: 3;
            position: relative;
            width: 100%;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            border: none;
        }
        .btn-add {
            border-radius: 2em;
            font-size: 2rem;
            font-weight: 900;
            background: var(--color-accent);
            color: white;
            width: 2em;
            height: 2em;
            aspect-ratio: 1;
        }
        .btn-add:hover {
            background-color: var(--color-accent-hover);
            cursor: pointer;
        }
        #btn-add {
            position: fixed;
            right: 4rem;
            bottom: 2rem;
            z-index: 1000;
        }

        .search-bar {
            display: flex;
            background: var(--color-secondary);
            position: absolute;
            width: 50%;
            top: 1em;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem;
            border-radius: 20px;
            margin-bottom: 10px;
            z-index: 1000;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1rem;
            margin-left: 0.5rem;
        }
    </style>

</head>
<body>
    <aside id="hecho-preview">
        <button class="btn-close" onclick="toggleHechoPreview(false)">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="data-container">
            <h3 id="hecho-preview__title"></h3>
        </div>
    </aside>
    <main>
        <div id="map"></div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar...">
        </div>
        <button class="btn-add" id="btn-add">
            <i class="fa-solid fa-plus"></i>
        </button>
    </main>
</body>
<script>

// Barra lateral con información del hecho seleccionado.
const hechoPreview = {
    self: document.getElementById('hecho-preview'),
    title: document.getElementById('hecho-preview__title')
};

// Lista con los hechos obtenidos del agregador.
const hechos = [
    {
        title: 'Ráfagas de más de 100 km/h causa estragos en San Vicente, Misiones',
        descripcion: 'La región de San Vicente en Misiones sufrió los efectos de una intensa ráfagas de más de 100 km/h. El incidente obligando a evacuar a residentes de la zona. Se ha convocado al comité de crisis para coordinar las acciones de respuesta.',
        categoria: 'Ráfagas de más de 100 km/h',
        ubicacion: [-27.029465, -54.436559],
        fechaHecho: '2007-12-21'
    }
];

// Crea el mapa y lo pone en el elemento #map.
const map = L.map('map', {
center: [-27.029465, -54.436559],
zoom: 13
});

// Agrega una layer de openstreetmap.org al mapa (esto es para que renderice un mapa, sino queda vacío).
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png?{foo}', {
        foo: 'bar',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
).addTo(map);

addHechoListToMap(hechos);


// --- funciones --------------------------------------------------------------------------------------------------

// Agrega marcadores al mapa por cada hecho que se le pase por parámetro.
function addHechoListToMap(hechos) {
    for (const i in hechos) {
        const hecho = hechos[i];
        addHechoToMap(hecho);
    }
}

// Agrega un marcador del hecho al mapa. Al hacerle click, despliega la barra lateral y
// muestra la información de ese hecho.
function addHechoToMap(hecho) {
    const marker = L.marker(hecho.ubicacion, {
        riseOnHover: true,
        hecho: hecho
    }).addTo(map).bindTooltip(`<b><center>${hecho.title}</center></b>`, {permanent: false, direction: "top"});

    marker.on('click', onHechoMarkerClick);
}


function onHechoMarkerClick(e) {
    openHecho(e.target.options.hecho);
}


function openHecho(hecho) {
    toggleHechoPreview(true);
    hechoPreview.title.textContent = hecho.title;
}


function toggleHechoPreview(force = null) {
    hechoPreview.self.classList.toggle('active', force);
}

</script>
</html>
