<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mapa</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        html {
            height: 100%;
        }
        body {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            border: none;
        }
        .btn-add {
            border-radius: 2em;
            font-size: 2rem;
            font-weight: 900;
            background: var(--color-accent);
            color: white;
            width: 2em;
            height: 2em;
            aspect-ratio: 1;
            border: none;
            outline: none;
            cursor: pointer;
        }
        .btn-add:hover {
            background-color: var(--color-accent-hover);
        }
        #btn-add {
            position: fixed;
            right: 4rem;
            bottom: 2rem;
            z-index: 1000;
        }

        .search-bar {
            display: flex;
            background: var(--color-secondary);
            position: fixed;
            width: 50%;
            top: 1em;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1rem;
            margin-left: 0.5rem;
        }
    </style>

</head>
<body>
    <div id="map"></div>
    <button class="btn-add" id="btn-add">
        <i class="fa-solid fa-plus"></i>
    </button>
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Buscar...">
    </div>
</body>
<script>

const map = L.map('map', {
center: [-34.59, -58.42],
zoom: 13
});

// Agrega el mapa de openstreetmap.org
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png?{foo}', {
        foo: 'bar',
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
).addTo(map);

L.marker([-34.59, -58.42], {
    title: 'UTN.BA',
    riseOnHover: true
}).addTo(map).bindPopup("<b>EVENTO</b><br>UTN.BA").openPopup();

</script>
</html>
