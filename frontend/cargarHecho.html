<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cargar hecho | METAmapa</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script> <!--Para la flecgita-->
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet"> <!--Para el logo-->
    <style>

        body{
            background-image: url('fondoLevementeCargado.png');
            background-size: cover;                 /* Que cubra toda la pantalla */
            background-repeat: no-repeat;           /* Que no se repita */
            background-attachment: fixed;           /* Fijo */
            background-position: center center;     /* Que esté centrada */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }


        main{
        }


           .container{
            background-color: #d9d9d9;     /* CAMBIAR */
            border-radius: 1rem;
            padding: 0.8rem;
            padding-bottom: 0;
            margin:0;
        }

        .cargar-hecho-form {
            display: block;
        }

        .input-primerFila{
            display: flex;
            gap: 0.5rem;
            justify-content: space-between;
            align-items: center;
        }

        .input-cargarHecho{
            padding: 0.3rem;
            margin: 0.5rem 0.2rem 0.2rem 0.5rem;
        }

        input[type="text"]{
            background-color: #bdbcbc;
            border-radius: 0.3rem;
            padding:0.2rem;
        }


        #titulo-cargarHecho{
            margin: 0.1rem 0.2rem 0.2rem 0.2rem;
        }

        .input-tercerFila{
            margin-top:0;
            padding-top: 0.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            align-items: center;
        }

        .input-imagenes{
            border-radius: 0.2rem;
            border-color: #8f8e8e;
            margin-right: 6rem;
            border-style: solid;
            border-width: 0.2vw;
            margin-bottom: 0.1rem;
            padding:0;
        }


        input[type="date"]{
            background-color: #bdbcbc;
            border-radius: 0.3rem;
        }

        textarea{
            background-color: #bdbcbc;
            width: 100%;
            height: 5rem;
            resize: none;
            border-radius: 0.3rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon .input-icon {
            position: absolute;
            left: 0.5em;
            top: 75%;
            height: 100%;
            aspect-ratio: 1;
            font-size: small;
            transform: translateY(-50%);
            z-index: 2;
        }

        .input-with-icon > input {
            position: relative;
            padding-left: 2em;
        }


        .custom-file {
            display: inline-block;
            padding: 0.5rem;
            background: #007BFF;
            color: white;
            border-radius: 0.3rem;
            cursor: pointer;
        }

        .custom-file:hover {
            background: #0056b3;
        }
        input[type="file"] {
            display: none;
        }
        #preview {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .preview-item {
            position: relative;
            display: inline-block;
        }
        .preview-item img {
            max-width: 150px;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 5px;
            object-fit: cover;
        }
        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 16px;
            line-height: 20px;
        }
        .remove-btn:hover {
            background: red;
        }

        .button-footer{
            justify-content: flex-end;
            display: flex;
        }

        .btn-submit{
            font-size: 1rem;
            text-decoration: none;
            padding: 0.5em;   /*em es una unidad relativa al tamaño de letra*/
            border-radius: 2em;
            color: black;
            font-weight: bold;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .tag {
            background: #007BFF;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .tag button {
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        .tag-input {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .add-btn {
            padding: 6px 12px;
            margin-left: 5px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #218838;
        }

    </style>
</head>

<body>
    <main>
        <a href="" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
        <div id="fixed-logo"></div>
        <form class="cargar-hecho-form" action="" method="POST"> <!--action: ¿a donde se enviarán los datos? method: metodo HTTP usado para mandar los datos -->
        <div class = "container">

                <h2 id="titulo-cargarHecho">Cargar Hecho</h2>
                <div class ="input-primerFila">
                    <div class="input-cargarHecho">
                        <h4>Titulo</h4>
                        <label for ="tituloHecho"></label>
                        <input type="text" id="tituloHecho" name="tituloHecho" required>
                    </div>

                    <div class="input-cargarHecho">
                        <h4>Categoria</h4>
                        <label for ="categoria"></label>
                        <input type="text" id="categoria"><!--categoria-->
                    </div>

                    <div class="input-cargarHecho">
                        <h4>Lugar</h4>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-magnifying-glass input-icon" id="input-icon"></i>
                            <input type="text" id="lugar" name="lugar">
                        </div>
                    </div>
                </div>

                <div class="input-cargarHecho">
                    <h4>Descripción</h4>
                    <label for ="descripcion"></label>
                    <textarea id="descripcion" placeholder="Escribe una descripcion..."></textarea><!--Descripcio-->
                </div>

                <div class="input-tercerFila">
                    <div class="input-cargarHecho">
                        <h4>Fecha</h4>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="input-cargarHecho">
                        <h4>Etiquetas</h4>
                        <input type="text" id="tagInput" class="tag-input" placeholder="Escribe una etiqueta...">
                        <button type="button" id="addTag" class="add-btn">➕</button>
                        <!-- contenedor visual -->
                        <div id="tagContainer" class="tag-container"></div>
                        <!-- input oculto con las etiquetas -->
                        <input type="hidden" name="tags" id="hiddenTags">
                    </div>
                </div>

            <div class="input-imagenes">
                <div class="input-cargarHecho">
                    <label for="fotos" class="custom-file">Sube imágenes📷 </label>
                    <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
                    <div id="preview"></div>
                </div>
            </div>

            <div class="button-footer">
            <button class="btn-submit" type="submit">Cargar</button>
            </div>
        </div>
        </form>
    </main>

    <script>
        (() => {
            /*** CARGA DE FOTOS ***/
            const inputFotos = document.getElementById("fotos");
            const preview = document.getElementById("preview");
            let filesArray = [];

            function mostrarPreviews() {
                preview.innerHTML = "";
                filesArray.forEach((file, index) => {
                    if (file.type.startsWith("image/")) {
                        const reader = new FileReader();
                        reader.onload = e => {
                            const container = document.createElement("div");
                            container.classList.add("preview-item");

                            const img = document.createElement("img");
                            img.src = e.target.result;

                            const btn = document.createElement("button");
                            btn.textContent = "×";
                            btn.classList.add("remove-btn");
                            btn.onclick = (ev) => {
                                ev.preventDefault();
                                eliminarArchivo(index);
                            };

                            container.appendChild(img);
                            container.appendChild(btn);
                            preview.appendChild(container);
                        };
                        reader.readAsDataURL(file);
                    }
                });

                const dataTransfer = new DataTransfer();
                filesArray.forEach(file => dataTransfer.items.add(file));
                inputFotos.files = dataTransfer.files;
            }

            function eliminarArchivo(index) {
                filesArray.splice(index, 1);
                mostrarPreviews();
            }

            inputFotos.addEventListener("change", () => {
                const nuevosArchivos = Array.from(inputFotos.files);
                filesArray = filesArray.concat(nuevosArchivos);
                mostrarPreviews();
            });

            /*** ETIQUETAS ***/
            const inputTags = document.getElementById("tagInput");
            const addBtn = document.getElementById("addTag");
            const tagContainer = document.getElementById("tagContainer");
            const hiddenInput = document.getElementById("hiddenTags");
            let etiquetas = [];

            function actualizarHidden() {
                hiddenInput.value = etiquetas.join(",");
            }

            function crearEtiqueta(texto) {
                const tagText = texto.trim();
                if (!tagText || etiquetas.includes(tagText)) return;

                etiquetas.push(tagText);
                actualizarHidden();

                const tag = document.createElement("div");
                tag.classList.add("tag");
                tag.textContent = tagText;

                const btn = document.createElement("button");
                btn.textContent = "×";
                btn.onclick = (e) => {
                    e.preventDefault();
                    etiquetas = etiquetas.filter(et => et !== tagText);
                    actualizarHidden();
                    tag.remove();
                };

                tag.appendChild(btn);
                tagContainer.appendChild(tag);
                inputTags.value = "";
            }

            addBtn.addEventListener("click", () => crearEtiqueta(inputTags.value));
            inputTags.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    crearEtiqueta(inputTags.value);
                }
            });

        })();
    </script>
</body>
</html>
