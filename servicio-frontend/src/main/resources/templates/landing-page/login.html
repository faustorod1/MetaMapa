<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | METAmapa</title>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/login-register.css}">
    <script th:src="@{/js/script.js}"></script>
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>

    <style>
        body {
            min-height: 100%;
            margin: 5rem;
            background-image: url('/fondoLevementeCargado.png');
            background-attachment: fixed;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            align-items: center;
            justify-content: center;
            display: flex;
        }

        a {
            align-items: center;
            justify-content: center;
        }

    </style>
</head>

<body>
    <a th:href="@{/}"  id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
    <div id="fixed-logo"></div>

    <form th:action="@{/login}" th:object="${datosLogin}" class="login-form" method="POST">

        <h2>Iniciar sesión</h2>
        <div class="input-container">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" th:field="*{email}" name="email" required>

        </div>
        <div class="input-container">
            <label for="password">Contraseña</label>
            <span>
                <i class="fa-solid fa-eye password-show"
                    id="password-show"
                    onclick="togglePasswordVisible('password-show')"></i>
                <input type="password" id="password" name="password" th:field="*{password}" required>
            </span>
        </div>


        <button class="btn-submit" type="submit" id="btn-login">Iniciar sesión</button>


        <div id="go-to-login">
            ¿Todavía no tiene una cuenta? <a th:href="@{/register}">Crear cuenta</a>
        </div>
    </form>

</body>
</html>
