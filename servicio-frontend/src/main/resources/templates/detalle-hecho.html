<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Detalle de hecho | METAmapa</title>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/login-register.css}" />
    <script th:src="@{/js/script.js}"></script>

    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>

    <style>
        :root {
            font-size: 16px;
        }

        body {
            height: 90vh;
            margin:0;
            font-family: Arial, sans-serif;
            background-image: var(--imagen-fondo-levemente-cargado);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
        }


        .card {
            background: var(--color-main);
            border-radius: 1rem;
            padding: 1.5rem;
            height: 95vh;
            display: flex;
            flex-direction: column;
            max-width: 70rem;
            width: 80%;
            position: relative;
            margin-top:5rem;
        }

        .header {
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top:0;
        }

        .titulo {
            font-size: 2rem;
            font-weight: bold;
        }

        .categoria {
            color: white;
            font-weight: normal;
            margin-left: 1rem;
            font-size: 1.25rem;
        }

        .fecha {
            margin: 0.75rem 0;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .ubicacion {
            font-size: 1.125rem;
            margin-bottom: 0.8rem;
        }

        /* Contenedor principal de imágenes */
        .contenedor-imagenes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0;
            overflow-y: auto;
            max-height: 70vh;
            padding: 0.5rem 0;
        }

        /* Imágenes de tamaño igual (achicadas) */
        .imagen-miniatura {
            /* Calcula para que quepan 5 imágenes por fila */
            flex: 0 0 calc(20% - 0.4rem);
            height: 6rem;
            background: white;
            border-radius: 0.5rem;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }
        .imagen-miniatura:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .imagen-miniatura img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            transition: transform 0.3s ease;
        }
        .imagen-miniatura:hover img {
            transform: scale(1.05);
        }

        .descripcion {
            padding: 0rem;
        }

        .descripcion textarea {
            width: 100%;
            min-height: 6rem;
            border: none;
            background-color: #E3E3E3;
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-size: 1.125rem;
            resize: vertical;
            font-family: inherit;
        }


        .editar {
            background: var(--color-main-2);
            margin-top:0.1rem;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            float: right;
        }

        .editar:hover {
            background: var(--color-main-2-hover);
        }


        /* Estilos para detalles en fila */
        .detalles-fila {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 0.8rem;
        }
        .detalles-fila .coordenadas,
        .detalles-fila .fuente {
            margin-bottom: 0;
            white-space: nowrap;
        }


        .flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            cursor: pointer;
            background: var(--color-main-2);
            border-radius: 50%;
            padding: 0.5rem;
            user-select: none;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.2);
            transition: font-weight 0.2s ease, background 0.2s ease;
        }

        .flecha:hover {
            font-weight: bold;
            background: var(--color-main-2-hover);
        }


        .flecha.izquierda { left: -3rem; }
        .flecha.derecha { right: -3rem; }


        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: #000;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            display: block;
        }
        .close-modal {
            position: absolute;
            top: 0.25rem;
            right: 0.5rem;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            border-radius: 0.5rem;
            padding: 0 0.5rem;
            user-select: none;
            line-height: 1;
            transition: background 0.2s ease;
        }
        .close-modal:hover {
            background: rgba(255, 255, 255, 0.7);
            color: #000;
        }

        #btn-back-page {
            position: fixed;
            top: 1em;
            left: 1em;

            text-decoration: none;
            font-weight: bolder;
            color: black;
            cursor: pointer;
        }
        #btn-back-page:hover {
            color: grey;
        }

        /* Estilos de detalle (color modificado) */
        .coordenadas, .fuente, .etiquetas, .metadata small {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.7); /* Gris claro sutil */
        }
        .etiquetas {
            margin-top: 0.8rem;
            font-weight: 500;
        }
        .metadata {
            margin-top: 0.5rem;
        }
        .metadata small {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<a th:href="@{/main}" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
<div id="fixed-logo"></div>

<div class="card">

    <div class="header">
        <div>
            <span class="titulo" th:text="${hechoDTO.titulo}">Titulo del hecho</span>
            <span class="categoria" th:text="${hechoDTO.categoria.nombre}">Categoria</span>

            <div class="fecha" th:text="${hechoDTO.fechaHecho.toLocalDate()}">DD/MM/AAAA</div>

            <div class="ubicacion" th:if="${hechoDTO.departamento}">
                <i class="fa-solid fa-location-dot"></i>
                <span th:text="${hechoDTO.departamento.getNombre() + ', ' + hechoDTO.departamento.getProvincia().getNombre()}">Departamento, Provincia</span>
            </div>

            <div class="detalles-fila">

                <div class="coordenadas" th:if="${hechoDTO.lugarAcontecimiento}">
                    <i class="fa-solid fa-globe"></i>
                    Coordenadas: <span th:text="${hechoDTO.lugarAcontecimiento.latitud}">Latitud</span>, <span th:text="${hechoDTO.lugarAcontecimiento.longitud}">Longitud</span>
                </div>

                <div class="fuente" th:if="${hechoDTO.idExterno != null and hechoDTO.idExterno.fuente != null}">
                    <i class="fa-solid fa-link"></i>
                    Fuente: <span th:text="${hechoDTO.idExterno.fuente.tipoDeFuente}">Tipo de Fuente</span>
                </div>

            </div>

            <div class="etiquetas" th:if="${hechoDTO.etiquetas != null and not #sets.isEmpty(hechoDTO.etiquetas)}">
                <i class="fa-solid fa-tag"></i>
                Etiquetas:
                <span th:each="etiqueta : ${hechoDTO.etiquetas}" th:text="'#' + ${etiqueta} + ' '">#etiqueta</span>
            </div>



        </div>
    </div>


    <div class="descripcion">
        <textarea style="resize: none" placeholder="Descripción" readonly th:text="${hechoDTO.descripcion}"></textarea>
    </div>

    <div class="contenedor-imagenes" th:if="${hechoDTO.contenidosMultimedia != null and not #lists.isEmpty(hechoDTO.contenidosMultimedia)}">
        <div class="imagen-miniatura" th:each="multimedia : ${hechoDTO.contenidosMultimedia}">

            <img th:src="${multimedia.pathImagen}"
                 th:alt="'Imagen del hecho ' + ${hechoDTO.titulo}" />

        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <img src="" alt="Imagen expandida" id="modalImage" />
        </div>
    </div>
</div>

    <script>
        // Seleccionar elementos relevantes
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const closeModalBtn = document.getElementById('closeModal');
        // Todas las imágenes pequeñas
        const imagenes = document.querySelectorAll('.imagen-miniatura img');
        imagenes.forEach(img => {
            img.addEventListener('click', () => {
                modal.style.display = 'flex';
                modalImage.src = img.src;
                modalImage.alt = img.alt;
            });
        });
        // Cerrar modal al hacer clic en la X
        closeModalBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            modalImage.src = '';
            modalImage.alt = '';
        });
        // Cerrar modal al hacer clic fuera de la imagen
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                modalImage.src = '';
                modalImage.alt = '';
            }
        });
        // También se puede cerrar con la tecla ESC (opcional)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                modal.style.display = 'none';
                modalImage.src = '';
                modalImage.alt = '';
            }
        });
    </script>
</body>
</html>
