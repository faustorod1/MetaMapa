<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Detalle de hecho | METAmapa</title>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/login-register.css}" />
    <script th:src="@{/js/script.js}"></script>

    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>

    <style>
        :root {
            font-size: 16px;
        }

        body {
            margin: 0;
            background-image: url('../static/fondoLevementeCargado.png');
            background-size: cover;                 /* Que cubra toda la pantalla */
            background-repeat: no-repeat;           /* Que no se repita */
            background-attachment: fixed;           /* Fijo */
            background-position: center center;     /* Que esté centrada */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: var(--color-main);
            border-radius: 1rem;
            padding: 1.5rem;
            height:80vh;
            max-width: 70rem;
            width: 80%;
            position: relative;
            margin-top:2.2rem;
        }

        .header {
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top:0;
        }

        .titulo {
            font-size: 2rem;
            font-weight: bold;
        }

        .categoria {
            color: white;
            font-weight: normal;
            margin-left: 1rem;
            font-size: 1.25rem;
        }

        .fecha {
            margin: 0.75rem 0;
            font-weight: bold;
            font-size: 1.25rem;
        }

        .ubicacion {
            font-size: 1.125rem;
            margin-bottom: 0.8rem;
        }

        .imagenes {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin: 0.5rem 0;
            padding:0;
        }

        .imagen {
            flex: 1;
            height: 9rem;
            background: white;
            border-radius: 0.5rem;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            transition: transform 0.3s ease;
        }
        .imagen:hover img {
            transform: scale(1.05);
        }

        .descripcion {
            padding: 0rem;
        }

        .descripcion textarea {
            width: 100%;
            min-height: 6rem;
            border: none;
            background-color: #E0E0E0;
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-size: 1.125rem;
            resize: vertical;
            font-family: inherit;
        }


        .editar {
            background: var(--color-main-2);
            margin-top:0.1rem;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            float: right;
        }

        .editar:hover {
            background: var(--color-main-2-hover);
        }

        .menu {
            background-color: var(--color-main-2);
            font-size: 2rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            line-height: 1;
            transition: background 0.2s ease;
        }

        .menu:hover {
            background: var(--color-main-2-hover);
        }



        .flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            cursor: pointer;
            background: var(--color-main-2);
            border-radius: 50%;
            padding: 0.5rem;
            user-select: none;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.2);
            transition: font-weight 0.2s ease, background 0.2s ease;
        }

        .flecha:hover {
            font-weight: bold;
            background: var(--color-main-2-hover);
        }


        .flecha.izquierda { left: -3rem; }
        .flecha.derecha { right: -3rem; }


        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: #000;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            display: block;
        }
        .close-modal {
            position: absolute;
            top: 0.25rem;
            right: 0.5rem;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            border-radius: 0.5rem;
            padding: 0 0.5rem;
            user-select: none;
            line-height: 1;
            transition: background 0.2s ease;
        }
        .close-modal:hover {
            background: rgba(255, 255, 255, 0.7);
            color: #000;
        }

        #btn-back-page {
            position: fixed;
            top: 1em;
            left: 1em;

            text-decoration: none;
            font-weight: bolder;
            color: black;
            cursor: pointer;
        }
        #btn-back-page:hover {
            color: grey;
        }


    </style>
</head>
<body>

    <a th:href="@{/main}" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
    <div id="fixed-logo"></div>

<div class="card">
    <span class="flecha izquierda">&#10094;</span>
    <span class="flecha derecha">&#10095;</span>

    <div class="header">
        <div>
            <span class="titulo" th:text="${hechoDTO.titulo}">Titulo del hecho</span>
            <span class="categoria" th:text="${hechoDTO.categoria.nombre}">Categoria</span>
            <div class="fecha" th:text="${hechoDTO.fechaHecho.toLocalDate()}">DD/MM/AAAA</div>
            <div class="ubicacion" th:text="${hechoDTO.departamento.getNombre() + ', ' + hechoDTO.departamento.getProvincia().getNombre()}">Una Dirección 1234</div>
        </div>
        <div class="menu">⋮</div>
    </div>


    <div class="descripcion">
        <textarea style="resize: none" placeholder="Descripción" readonly th:text="${hechoDTO.descripcion}"></textarea>
    </div>

    <div class="imagenes" th:if="${hechoDTO.contenidosMultimedia != null and not #lists.isEmpty(hechoDTO.contenidosMultimedia)}">
        <img th:each="multimedia : ${hechoDTO.contenidosMultimedia}"
             th:src="${multimedia.pathImagen}"
             th:alt="'Imagen del hecho ' + ${hechoDTO.titulo}"
             class="imagen-hecho"/>

    </div>

    <!-- Modal para imagen expandida -->
    <div class="modal" id="modal">
        <div class="modal-content">
        <span class="close-modal" id="closeModal">&times;</span>
        <img src="" alt="Imagen expandida" id="modalImage" />
        </div>
        </div>

<script>
    // Seleccionar elementos relevantes
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const closeModalBtn = document.getElementById('closeModal');
    // Todas las imágenes pequeñas
    const imagenes = document.querySelectorAll('.imagen img');
    imagenes.forEach(img => {
        img.addEventListener('click', () => {
            modal.style.display = 'flex';
            modalImage.src = img.src;
            modalImage.alt = img.alt;
        });
    });
    // Cerrar modal al hacer clic en la X
    closeModalBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        modalImage.src = '';
        modalImage.alt = '';
    });
    // Cerrar modal al hacer clic fuera de la imagen
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            modalImage.src = '';
            modalImage.alt = '';
        }
    });
    // También se puede cerrar con la tecla ESC (opcional)
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.style.display === 'flex') {
            modal.style.display = 'none';
            modalImage.src = '';
            modalImage.alt = '';
        }
    });
</script>
</body>
</html>
