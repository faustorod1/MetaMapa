<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crear solicitud de eliminación | METAmapa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">

    <style>

        body {
            height: 90vh;
            margin:0;
            font-family: Arial, sans-serif;
            background-image:url('/fondoLevementeCargado.png');
            background-size: cover;                 /* Que cubra toda la pantalla */
            background-repeat: no-repeat;           /* Que no se repita */
            background-attachment: fixed;           /* Fijo */
            background-position: center center;     /* Que esté centrada */
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
        }


        .contenedor {
            background: var(--color-main);
            width:70vw;
            margin-top:2rem;
            margin-bottom:0;
            padding: 0.5rem;
            height: 83vh;
            border-radius: 0.5rem;
        }

        .contenedor h1 {
            font-size: 2em;
            font-weight: bold;
            color: whitesmoke;
        }

        #h1-main{
            margin: 0.2rem 1rem 0.2rem 1rem;
            align-self:flex-start;
            text-align: left;
            padding:0;
            font-size:2rem;
        }

        .contenedor-header{
            background: var(--color-secondary);
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.5rem;
        }

        .contenedor-header h1 {
            font-size: 1em;
            font-weight: bold;
            color: black;
            margin:0;
        }

        .contenedor-header h2{
            font-size: 0.8em;
            font-weight: normal;
            color: black;
            margin:0;
            margin-top:0.3rem;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: white;
        }

        textarea {
            height: 38vh;
            width: 100%;
            resize: none;
            border: none;
            margin:0;
            margin-bottom:0.2rem;
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-size: 1em;
            font-family: Arial, sans-serif;
            background: var(--color-secondary);
            color: black;
        }

        .acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        .min-char {
            font-size: 0.7em;
            color: lightgrey;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bolder;
            cursor: pointer;
        }

        .descartar {
            background:var(--color-accent-2);
            color: black;
        }

        .descartar:hover{
            background: var(--color-main-2-hover);
        }

        .enviar {
            background-color: var(--color-main-2);
            color: black;
        }

        .enviar:hover{
            background: var(--color-main-2-hover);
        }
    </style>

</head>
    <body>
    <a th:href="@{/main}"  id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
    <div id="fixed-logo"></div>

    <div class="contenedor">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"
             style="margin-bottom: 5px; padding: 10px; border: 1px solid red; background-color: #f8d7da; color: #721c24;">
        </div>

        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"
             style="margin-bottom: 5px; padding: 10px; border: 1px ;background-color: #d4edda; color: #155724;">
        </div>

        <div th:if="${spam}" class="alert alert-danger" th:text="${spam}"
             style="margin-bottom: 5px; padding: 10px; border: 1px solid red; background-color: #f8d7da; color: #721c24;">
        </div>

        <div th:if="${falta_caracteres}" class="alert alert-danger" th:text="${falta_caracteres}"
             style="margin-bottom: 5px; padding: 10px; border: 1px solid red; background-color: #f8d7da; color: #721c24;">
        </div>

        <h1 id="h1-main">Solicitud de eliminación</h1>
        <div class="contenedor-header">
            <h1 th:text="${hecho.titulo}">Título Hecho</h1>
            <h2 th:text="${hecho.descripcion}">Descripcion Del Hecho</h2>
        </div>

        <form th:action="@{/api/solicitudes/solicitarEliminacion}" method="post" th:object="${solicitud}">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" th:field="*{descripcion}" required></textarea>
            <input type="hidden" th:field="*{hechoId}"/>
        <div class="acciones">
            <button type = "button" class="descartar">Descartar</button>
            <span class="min-char" id="contador">min 500c.</span>
            <button type="submit" class="enviar">Enviar</button>
        </div>
        </form>
    </div>

<script>
    const textarea = document.getElementById("descripcion");
    const contador = document.getElementById("contador");
    const minChar = 500;

    textarea.addEventListener("input", () => {
        const restante = minChar - textarea.value.length;
        if (restante > 0) {
            contador.textContent = `min ${restante}c.`;
        } else {
            contador.textContent = "Listo ✅";
        }
    });

    const form = document.querySelector("form");

    form.addEventListener("submit", (e) => {            // Esto prohibe que se mande la sol. si no llega a 500cc
        const texto = textarea.value.trim();
        if (texto.length < minChar) {
            e.preventDefault();
            alert(`La descripción debe tener al menos ${minChar} caracteres.`);
        }
    });
</script>
</body>
</html>
