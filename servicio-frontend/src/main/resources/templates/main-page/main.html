<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <title>Main | METAmapa</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>

</head>

<body>
<nav>
    <div class="nav-button-container">
        <button class="nav-button selected" view="./mapa" id="nav-button-home">
            <div class="nav-button-selection"></div>
            <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-button" view="./mis-hechos" id="nav-button-mis-hechos" sec:authorize="isAuthenticated()">
            <div class="nav-button-selection"></div>
            <i class="fa-solid fa-folder"></i>
        </button>

        <button class="nav-button" id="nav-button-modo-de-navegacion">
            <div class="nav-button-selection"></div>
            <i class="fa-solid fa-toggle-on"></i>
            <i class="fa-solid fa-toggle-off"></i>
        </button>
    </div>
    <div class="nav-button-container">
        <button class = "nav-button" id="nav-button-tratar-solicitud-de-modificacion" view = "./tratarSolicitudDeModificacion" th:if="${session.role == 'ADMIN'}">
            <div class="nav-button-selection"></div>
            <i class="fa-solid fa-file-pen"></i>
        </button>
        <button class="nav-button" id="nav-button-tratar-solicitud-de-eliminacion" view="./tratarSolicitudDeEliminacion" th:if="${session.role == 'ADMIN'}">
            <div class="nav-button-selection"></div>
            <i class="fa-solid fa-file-excel"></i>
        </button>
        <button class="nav-button" view="./administrar-colecciones" id="nav-button-adm-colecciones" th:if="${session.role == 'ADMIN'}">
            <div class="nav-button-selection"></div>
            <i class="fa-solid fa-clipboard-list"></i>
        </button>
        <button class="nav-button" id="nav-button-stadistics" view="./estadisticas" th:if="${session.role == 'ADMIN'}">
            <div class="nav-button-selection"></div>
            <i class="fa-solid fa-chart-line"></i>
        </button>

        <form title="Cerrar sesión" id="nav-button-logout" th:action="@{/logout}" th:if="${session.role == 'ADMIN' || session.role == 'CONTRIBUYENTE'}" method="POST">
            <button class="nav-button" type="submit">
                <div class="nav-button-selection"></div>
                <a class="fa-solid fa-right-from-bracket"></a>
            </button>
        </form>

        <button class="nav-button" title="Iniciar sesión" id="nav-button-login"  th:if="${session.role != 'ADMIN' && session.role != 'CONTRIBUYENTE'}">
            <div class="nav-button-selection"></div>
            <a class="link-no-style fa-solid fa-right-to-bracket" th:href="@{/login}"></a>
        </button>


    </div>
</nav>
<main>
    <iframe
            id="main-iframe"
            src="./main/mapa"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
    </iframe>
</main>
</body>
<script>

    const navButtons = document.querySelectorAll('.nav-button');
    const iframe = document.getElementById('main-iframe');
    const modoBtn = document.getElementById('nav-button-modo-de-navegacion');

    // Botones normales
    navButtons.forEach(button => {
        if (button !== modoBtn) {
            button.addEventListener('click', () => {
                // Quitar selected de los demás (excepto modoBtn)
                navButtons.forEach(btn => {
                    if (btn !== modoBtn) btn.classList.remove('selected');
                });
                // Seleccionar este botón
                button.classList.add('selected');

                // Cambiar iframe
                const view = button.getAttribute('view');
                if (view) iframe.src = `main/${view}`;
            });
        }
    });

    modoBtn.addEventListener('click', () => {
        modoBtn.classList.toggle('selected');
        console.log("Modo de navegación:", modoBtn.classList.contains('selected') ? "Activado" : "Desactivado");
    });
</script>
</html>
