<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa | METAmapa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mapa.css}">
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
<div id="top-curtain"></div>

<aside id="hecho-preview">
    <button class="btn-close" onclick="toggleHechoPreview(false)">
        <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="data-container">
        <h3 id="hecho-preview__titulo"></h3>
        <p id="hecho-preview__categoria"></p>
        <p><b>Fecha:</b> <span id="hecho-preview__fecha"></span></p>
        <p><b>Ubicación:</b> <span id="hecho-preview__ubicacion"></span></p>
        <p id="hecho-preview__descripcion"></p>
    </div>
    <button id="hecho-preview__btn-sol-eliminacion" onclick="openCrearSolicitudEliminacion()" th:if="${session.role == 'CONTRIBUYENTE'}">Solicitar Eliminación</button>
    <button id="hecho-preview__btn-open-details" onclick="openDetalleHecho()">Ver detalles</button>
</aside>

<main>
    <div id="map"></div>
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Buscar..." > <!--onfocus="openBuscador()"-->
    </div>

    <button class="btn-add" id="btn-add" onclick="onBtnAddClick(event)">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="btn-add-list">
        <form th:action="@{/hechos/formulario-de-carga}" method="get" style="display:inline;">
            <button class="btn-add" id="btn-add-hecho" title="Cargar hecho">
                <i class="fa-solid fa-newspaper"></i>
            </button>
        </form>

        <form th:action="@{/hechos/importarCSV}" method="get" style="display:inline;">
            <button class="btn-add" id="btn-add-dataset" title="Importar DataSet" th:if="${session.role == 'ADMIN'}">
                <i class="fa-solid fa-file-import"></i>
            </button>
        </form>

        <form th:action="@{/colecciones/formulario-de-carga}" method="get" style="display:inline;">
            <button class="btn-add" id="btn-add-coleccion" title="Crear colección" th:if="${session.role == 'ADMIN'}">
                <i class="fa-solid fa-layer-group"></i>
            </button>
        </form>
    </div>
</main>

<!-- JSON de hechos embebido -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const hechos = /*[[${hechos}]]*/ [];
    console.log("Hechos cargados desde el backend:", hechos);
    /*]]>*/
</script>

<script>
    let hechoActual = null;
    let allMarkers = [];

    // --- Elementos de la vista lateral ---
    const hechoPreview = {
        self: document.getElementById('hecho-preview'),
        titulo: document.getElementById('hecho-preview__titulo'),
        categoria: document.getElementById('hecho-preview__categoria'),
        fecha: document.getElementById('hecho-preview__fecha'),
        ubicacion: document.getElementById('hecho-preview__ubicacion'),
        descripcion: document.getElementById('hecho-preview__descripcion'),
    };

    // --- Logica del buscador ---
    const searchInput = document.querySelector(".search-bar input");

    // Creamos la función que filtra el mapa
    function filtrarMapa() {
        const textoBusqueda = searchInput.value.trim().toLowerCase();

        // Recorremos TODOS los marcadores que creamos
        allMarkers.forEach(marker => {
            const hecho = marker.options.hecho;

            const titulo = hecho.titulo?.toLowerCase() || "";
            const descripcion = hecho.descripcion?.toLowerCase() || "";

            // Comprobamos si el texto de búsqueda está en el título O en la descripción
            const coincide = titulo.includes(textoBusqueda) || descripcion.includes(textoBusqueda);

            if (textoBusqueda === "" || coincide) {
                marker.addTo(map);
            } else {
                marker.remove();
            }
        });
    }

    searchInput.addEventListener('input', filtrarMapa);

    // --- Fin de logica del buscador ---



    // --- Inicializa el mapa ---
    const map = L.map('map', {
        center: [-38.4161, -63.6167], // centro de Argentina
        zoom: 5
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // --- Carga de marcadores ---
    addHechoListToMap(hechos);

    function addHechoListToMap(hechos) {
        if (!hechos || hechos.length === 0) {
            console.warn("No se recibieron hechos para mostrar.");
            return;
        }
        for (const hecho of hechos) {
            addHechoToMap(hecho);
        }
    }

    function addHechoToMap(hecho) {
        if (!hecho.lugarAcontecimiento) return;
        const { latitud, longitud } = hecho.lugarAcontecimiento;
        if (latitud == null || longitud == null) return;

        // Creamos el marcador con coordenadas
        const marker = L.marker([latitud, longitud], {
            riseOnHover: true,
            hecho: hecho
        }).addTo(map);

        marker.bindTooltip(`<b><center>${hecho.titulo}</center></b>`, {
            permanent: false,
            direction: "top"
        });

        marker.on('click', onHechoMarkerClick);

        allMarkers.push(marker);
    }

    // --- Interacción con el panel lateral ---
    function openHecho(hecho) {
        hechoActual = hecho;
        toggleHechoPreview(true);

        hechoPreview.titulo.textContent = hecho.titulo || "Sin título";
        hechoPreview.categoria.textContent = hecho.categoria?.nombre || "Sin categoría";
        hechoPreview.fecha.textContent = hecho.fechaHecho ? hecho.fechaHecho.split('T')[0] : "Sin fecha";

        // Mostrar departamento y provincia
        const depto = hecho.departamento?.nombre || "Desconocido";
        const prov = hecho.departamento?.provincia?.nombre || "Desconocida";
        hechoPreview.ubicacion.textContent = `${depto}, ${prov}`;

        hechoPreview.descripcion.textContent = hecho.descripcion || "Sin descripción disponible";
    }

    function toggleHechoPreview(force = null) {
        hechoPreview.self.classList.toggle('active', force);
    }

    function onHechoMarkerClick(e) {
        openHecho(e.target.options.hecho);
    }

    // --- Botones auxiliares ---
    function openDetalleHecho() {
        if (!hechoActual) return;
        window.location.href = `/detalle-hecho/${hechoActual.id}`;
    }

    function openCrearSolicitudEliminacion() {
        if (!hechoActual) return;
        window.location.href = `/crearSolicitudDeEliminacion?id=${hechoActual.id}`;
    }


    function onBtnAddClick(e) {
        const btn = e.currentTarget;
        const active = !btn.classList.contains('active');
        btn.classList.toggle('active', active);
        const list = document.getElementById('btn-add-list');
        list.classList.toggle('active', active);

        if (active) { // Si debe mostrar los botones, actualiza sus variables de translate
            list.querySelectorAll(".btn-add").forEach((btn, i) => {
                btn.style.setProperty('--translation', `${-(i + 1) * 110}%`);
            });
        }
    }


    const btnAdd = document.getElementById("btn-add-hecho");

    btnAdd.addEventListener("click", () => {
        window.location.href = "./cargarHecho.html";
    });

    const btnCSV = document.getElementById("btn-add-dataset");

    btnCSV.addEventListener("click", () => {
        window.location.href = "./importarCSV.html";
    });

    const btnColeccion = document.getElementById("btn-add-coleccion");

    btnColeccion.addEventListener("click", () => {
        window.location.href = "./crearColeccion.html";
    });

</script>
</body>
</html>
