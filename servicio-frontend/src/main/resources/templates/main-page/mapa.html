<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mapa | METAmapa</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mapa.css}">

    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
</head>

<body>

<aside id="hecho-preview">
    <button class="btn-close" onclick="toggleHechoPreview(false)">
        <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="data-container">
        <h3 id="hecho-preview__titulo"></h3>
        <p id="hecho-preview__categoria"></p>
        <p><b>Fecha:</b> <span id="hecho-preview__fecha"></span></p>
        <p><b>Ubicación:</b> <span id="hecho-preview__ubicacion"></span></p>
        <p id="hecho-preview__descripcion"></p>
    </div>

    <button onclick="openDetalleHecho()">Ver detalles</button>
</aside>

<main>
    <div id="map"></div>

    <!-- FORMULARIO DE FILTROS -->
    <form id="filtro-form">

        <!-- BUSCADOR POR TITULO -->
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text"
                   id="filtro-titulo"
                   placeholder="Buscar por título...">
        </div>

        <!-- FILTRO POR CATEGORIA -->
        <div class="search-bar">
            <i class="fa-solid fa-tags"></i>
            <select id="filtro-categoria">
                <option value="">Todas las categorías</option>
                <option th:each="cat : ${categorias}"
                        th:value="${cat.nombre}"
                        th:text="${cat.nombre}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn-filtrar">
            Aplicar filtros
        </button>
    </form>
</main>

<script th:src="@{/js/hechoLoader.js}"></script>

<script>
    let hechoActual = null;
    let hechos = [];
    let allMarkers = [];
    let markersLayer = L.markerClusterGroup();

    // --- Elementos de la vista lateral ---
    const hechoPreview = {
        self: document.getElementById('hecho-preview'),
        titulo: document.getElementById('hecho-preview__titulo'),
        categoria: document.getElementById('hecho-preview__categoria'),
        fecha: document.getElementById('hecho-preview__fecha'),
        ubicacion: document.getElementById('hecho-preview__ubicacion'),
        descripcion: document.getElementById('hecho-preview__descripcion'),
    };

    // --- BUSCADORES ---
    const filtroForm = document.getElementById('filtro-form');
    const inputTitulo = document.getElementById('filtro-titulo');
    const selectCategoria = document.getElementById('filtro-categoria');

    filtroForm.addEventListener('submit', function (event) {
        event.preventDefault();

        let filtros = [];

        const titulo = inputTitulo.value.trim();
        const categoria = selectCategoria.value;

        // 🔍 Filtro por titulo (SIEMPRE)
        if (titulo) {
            filtros.push({
                tipoDeFiltro: "titulo",
                parametros: { titulo: titulo }
            });
        }

        // 🏷 Filtro por categoria (SIEMPRE)
        if (categoria) {
            filtros.push({
                tipoDeFiltro: "categoria",
                parametros: { categoria: categoria }
            });
        }

        cargarHechosYActualizarMapa(filtros);
    });

    function cargarHechosYActualizarMapa(filtros = []) {
        markersLayer.clearLayers();
        allMarkers = [];

        cargarHechos(filtros).then(hechosNuevos => {
            hechos = hechosNuevos;
            addHechoListToMap(hechos);
        });
    }

    /* ================= MAPA ================= */

    const boundsArgentina = [
        [-58.0, -80.0],
        [-20.0, -50.0]
    ];

    const map = L.map('map', {
        center: [-38.4161, -63.6167],
        zoom: 5,
        minZoom: 4,
        maxBounds: boundsArgentina,
        maxBoundsViscosity: 1.0
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        noWrap: true
    }).addTo(map);

    map.addLayer(markersLayer);

    function addHechoListToMap(hechos) {
        if (!hechos || hechos.length === 0) return;

        let nuevosMarcadores = [];

        for (const hecho of hechos) {
            if (!hecho.lugarAcontecimiento) continue;
            const { latitud, longitud } = hecho.lugarAcontecimiento;
            if (latitud == null || longitud == null) continue;

            const marker = L.marker([latitud, longitud], {
                riseOnHover: true,
                hecho: hecho
            });

            marker.bindTooltip(`<b><center>${hecho.titulo}</center></b>`, {
                permanent: false,
                direction: "top"
            });

            marker.on('click', onHechoMarkerClick);

            nuevosMarcadores.push(marker);
            allMarkers.push(marker);
        }

        markersLayer.addLayers(nuevosMarcadores);
    }

    function openHecho(hecho) {
        hechoActual = hecho;
        toggleHechoPreview(true);

        hechoPreview.titulo.textContent = hecho.titulo || "Sin título";
        hechoPreview.categoria.textContent = hecho.categoria?.nombre || "Sin categoría";
        hechoPreview.fecha.textContent = hecho.fechaHecho ? hecho.fechaHecho.replace('T', ' ') : "Sin fecha";

        const depto = hecho.departamento?.nombre || "Desconocido";
        const prov = hecho.departamento?.provincia?.nombre || "Desconocida";
        hechoPreview.ubicacion.textContent = `${depto}, ${prov}`;

        hechoPreview.descripcion.textContent = hecho.descripcion || "Sin descripción disponible";
    }

    function toggleHechoPreview(force = null) {
        hechoPreview.self.classList.toggle('active', force);
    }

    function onHechoMarkerClick(e) {
        openHecho(e.target.options.hecho);
    }

    function openDetalleHecho() {
        if (!hechoActual) return;
        window.location.href = `/hechos/detalle-hecho/${hechoActual.id}`;
    }

    function openCrearSolicitudEliminacion() {
        if (!hechoActual) return;
        window.location.href = `/api/solicitudes/eliminacion/${hechoActual.id}`;
    }

    cargarHechosYActualizarMapa([]);
</script>
</body>
</html>
