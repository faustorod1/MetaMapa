<!DOCTYPE html>
<html lang="en">
<head>
    <title> Tratar eliminación | METAmapa</title>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        body{
            background-image: url('/fondoLevementeCargado.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
        }

        .container{
            margin-top: 4rem;
            background-color: var(--color-main);
            color: white;
            border-radius: 1rem;
            padding: 0.5rem;
            width: 85vw;
            height: 82vh;
            /* Añadido para posicionar las flechas dentro del contenedor */
            position: relative;
        }

        .header-titulo{
            margin-bottom: 0.5rem;
            margin-top:0.2rem;
            text-align: center; /* Centrar el título */
        }

        .container-data{
            padding: 0.3rem;
            margin: 0.1rem 0.2rem 0.2rem 0.2rem;
            text-align: left;
        }

        #container-data-2{
            margin-bottom:0.5rem;
            margin-top:0;
            border-bottom: 1px solid black;
        }

        textarea{
            margin-top:0.2em;
            background-color: white;
            width: 100%;
            height: 11rem;
            margin-bottom:0;
            padding: 0.3rem;
            resize: none;
            border-radius: 0.3rem;
            text-align: justify;
            font-family: inherit; /* Para usar la fuente del body */
            font-size: 1rem;
        }

        .btn-submit{
            font-size: 1.1rem;
            text-decoration: none;
            padding: 0.5em;
            margin-bottom: 0.5rem;
            border-radius: 2em;
            color: black;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--color-main-2);
            border: none;
        }

        .btn-submit:hover {
            background-color: var(--color-main-2-hover);
        }

        .buttons-footer{
            margin: 0.2rem;
            justify-content: space-between;
            align-items: center;
            display: flex;
        }

        /* ESTILOS DE FLECHA AÑADIDOS/ADAPTADOS */
        .flecha {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            cursor: pointer;
            background: var(--color-main-2);
            border-radius: 50%;
            padding: 0.5rem;
            user-select: none;
            box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.2);
            transition: background 0.2s ease;
            color: white; /* Asegura que el icono sea visible */
            text-decoration: none; /* Quitar el subrayado de enlace */
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10; /* Asegura que esté por encima de otros elementos */
        }

        .flecha:hover {
            background: var(--color-main-2-hover);
        }

        .flecha.izquierda { left: -3rem; }
        .flecha.derecha { right: -3rem; }

        #btn-back-page {
            position: fixed;
            top: 1em;
            left: 1em;
            text-decoration: none;
            font-weight: bolder;
            color: black;
            cursor: pointer;
            z-index: 20;
        }
        #btn-back-page:hover {
            color: grey;
        }

        /* Estilo para que el contenido del formulario tenga scroll si es muy largo */
        .content-area {
            height: calc(100% - 4.5rem); /* Ajusta la altura menos el header y footer */
            overflow-y: auto;
            padding: 0 0.5rem;
        }


    </style>


</head>
<body>



<a th:href="@{/main}" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
<div id="fixed-logo"></div>

<form th:action="@{/api/solicitudes/solicitudesDeEliminacion/resolverEliminacion}" th:object="${solicitud}" class="tratarSolicitudDeEliminacion-form" action="" method="post">
    <div class="container">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"
             style="margin-bottom: 20px; padding: 10px; border: 1px solid red; background-color: #f8d7da; color: #721c24;">
        </div>

        <a th:if="${anteriorId != null}"
           th:href="@{/api/solicitudes/tratarEliminacion/{id}(id=${anteriorId})}"
           class="flecha izquierda">
            <i class="fa-solid fa-chevron-left"></i>
        </a>

        <a th:if="${siguienteId != null}"
           th:href="@{/api/solicitudes/tratarEliminacion/{id}(id=${siguienteId})}"
           class="flecha derecha">
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <div class="header-titulo">
            <h2>Solicitud de eliminación (id: <span th:text="*{id}"></span>)</h2>
        </div>


        <div class="container-data" id="container-data-2">
                <p><strong>Fecha</strong>: <span th:text="${fechaSolicitud}"></span></p>
            <p><strong>Solicitante - id</strong>: <span th:text="${solicitud.solicitanteId}"></span></p>
        </div>

        <div class="container-data">
        <p><strong>Titulo</strong>: <span th:text="${hecho.titulo}"></span></p>
        </div>

        <div class="container-data">
            <p><strong>Descripción</strong>: <span th:text="${hecho.descripcion}"></span></p>
        </div>

        <div class="container-data">
            <p><strong>Justificación: </strong></p>
        <textarea readonly id="descripcion" th:text="${solicitud.descripcion}"> </textarea>
        </div>

        <input type="hidden" name="solicitudId" th:value="${solicitud.id}" />
        <div class ="buttons-footer">
            <button class="btn-submit" type="submit" name="accion" value="rechazar">Rechazar</button>
            <button class="btn-submit" type="submit" name="accion" value="aprobar">Aprobar</button>
        </div>
    </div>
</form>


</body>
</html>
