<!DOCTYPE html>
<html lang="en">
<head>
    <title> Tratar eliminación | METAmapa</title>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        body{
            background-image: url('../../static/fondoLevementeCargado.png');
            background-size: cover;                 /* Que cubra toda la pantalla */
            background-repeat: no-repeat;           /* Que no se repita */
            background-attachment: fixed;           /* Fijo */
            background-position: center center;     /* Que esté centrada */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
        }

        .container{
            background-color: var(--color-main);
            color: white;
            border-radius: 1rem;
            padding: 0.5rem;
            width: 85vw;
            height: 40vh;
        }

        .header-titulo{
            margin-bottom: 0.5rem;
            margin-top:0.2rem;
        }

        .container-data{
            padding: 0.3rem;
            margin: 0.1rem 0.2rem 0.2rem 0.2rem;
            text-align: left;
        }

        #container-data-2{
            margin-bottom:0.5rem;
            margin-top:0;
            border-bottom: 1px solid black;
        }

        textarea{
            margin-top:0.2em;
            background-color: white;
            width: 100%;
            height: 7rem;
            margin-bottom:0;
            padding: 0.3rem;
            resize: none;
            border-radius: 0.3rem;
            text-align: justify;
        }

        .btn-submit{
            font-size: 1.1rem;
            text-decoration: none;
            padding: 0.5em; /*em es una unidad relativa al tamaño de letra*/
            margin-bottom: 0.5rem;
            border-radius: 2em;
            color: black;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--color-main-2);
            border: none;
        }

        .btn-submit:hover {
            background-color: var(--color-main-2-hover);
        }

        .buttons-footer{
            margin: 0.2rem;
            justify-content: space-between;
            align-items: center;
            display: flex;
        }


        </style>


</head>
<body>

    <a href="" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
    <div id="fixed-logo"></div>    <!-- Acá falta la opción de ir variando entre solicitudes -->

    <form th:action="@{api/solicitudes/solicitudesDeEliminacion/tratar}" th:object="${solicitud}" class="tratarSolicitudDeEliminacion-form" action="" method="post">
    <div class="container">

        <div class="header-titulo">
            <h2>Solicitud de eliminación (ID: <span th:text="*{id}"></span>)</h2>
        </div>
    </div>


        <div class="container-data" id="container-data-2">
                <p><strong>Fecha</strong>: <span th:text="${solicitud.fechaDeCarga}"></span></p>
            <p><strong>Solicitante - ID</strong>: <span th:text="${solicitud.solicitanteID}"></span></p>
        </div>

        <div class="container-data">
        <p><strong>HechoID</strong>: <span th:text="${solicitud.hechoID}"></span></p>
        </div>

        <div class="container-data">
            <p><strong>HechoID </strong>: <span th:text="${solicitud.hechoID}"></span></p>
        </div>

        <div class="container-data">
            <p><strong>Justificación: </strong></p>
        <textarea readonly id="descripcion" th:text="${solicitud.descripcion}"> </textarea>
        </div>

        <input type="hidden" name="solicitudId" th:value="${solicitud.id}" />
        <div class ="buttons-footer">
            <button class="btn-submit" type="submit" name="accion" value="rechazar">Rechazar</button>
            <button class="btn-submit" type="submit" name="accion" value="aprobar">Aprobar</button>
        </div>
    </form>


</body>
</html>
