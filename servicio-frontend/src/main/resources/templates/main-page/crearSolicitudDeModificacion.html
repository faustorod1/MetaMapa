<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar hecho | METAmapa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/cargarHecho.css}" />
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">

    <script th:src="@{/js/locationService.js}"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        /* Estilos inline para ajustar las imágenes existentes al diseño actual */
        .contenedor-imagenes-existentes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .preview-item-existente {
            position: relative;
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
        }
        .preview-item-existente img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-item-existente .remove-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            width: 20px;
            height: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>

</head>

<body>
<main>
    <a th:href="@{/main}" id="btn-back-page"> <i class="fa-solid fa-chevron-left"></i></a>
    <div id="fixed-logo"></div>

    <!--/*@thymesVar id="hechoOutputDTO" type="ar.utn.ba.ddsi.models.dto.output.HechoOutputDTO"*/-->
    <form class="solicitar-modificacion-form" method="post" th:action="@{/api/solicitudes/solicitarModificacion}" th:object="${hecho}" enctype="multipart/form-data">

        <input type="hidden" name="id_hecho" th:value="${id_hecho}">
        <input type="hidden" name="id_externo_hecho" th:value="${id_externo_hecho}">

        <div class = "container">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"
                 style="margin-bottom: 20px; padding: 10px; border: 1px solid red; background-color: #f8d7da; color: #721c24;">
            </div>

            <div th:if="${exito}" class="alert alert-success" th:text="${exito}"
                 style="margin-bottom: 20px; padding: 10px; border: 1px ;background-color: #d4edda; color: #155724;">
            </div>

            <h2 id="titulo-cargarHecho" style="text-align: center" >Modificar hecho </h2>
            <div class ="input-primerFila">
                <div class="input-cargarHecho">
                    <h4>Título</h4>
                    <input type="text" id="titulo" th:field="*{titulo}" required>
                    <div th:if="${#fields.hasErrors('titulo')}" class="text-danger">
                        <small th:errors="*{titulo}">Error en titulo</small>
                    </div>
                </div>

                <div class="input-cargarHecho">
                    <h4>Categoria</h4>
                    <select name="categoria" id="categoria" required>
                        <option value="">-- Seleccionar Categoría --</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.nombre}"
                                th:text="${cat.nombre}"
                                th:selected="${#strings.toString(cat.nombre) == #object.categoria}">
                        </option>
                    </select>
                    <div th:if="${#fields.hasErrors('categoria')}" class="text-danger">
                        <small th:errors="*{categoria}">Error en la categoría</small>
                    </div>
                </div>

                <div class="input-cargarHecho">
                    <h4>Lugar</h4>
                    <div id="input-ubicacion-container">
                        <input type="text" id="ubicacion" placeholder="Cargando ubicación..." disabled required>

                        <input type="hidden" th:field="*{latitud}" id="latitud" required>
                        <input type="hidden" th:field="*{longitud}" id="longitud" required>

                        <button type="button" id="btn-show-input-lugar" onclick="toggleInputUbicacion(true)">
                            Seleccionar en el mapa
                            <i class="fa-solid fa-magnifying-glass input-icon" id="input-icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="input-cargarHecho">
                <h4>Descripción</h4>
                <textarea id="descripcion" th:field="*{descripcion}"></textarea>
            </div>

            <div class="input-tercerFila">
                <div class="input-cargarHecho">
                    <h4>Fecha y hora</h4>
                    <input type="datetime-local" id="fecha" th:field="*{fechaHecho}" required>
                </div>

                <div class="input-cargarHecho">
                    <h4>Etiquetas</h4>
                    <input type="text" id="tagInput" class="tag-input" placeholder="Escribe una etiqueta...">
                    <button type="button" id="addTag" class="add-btn">➕</button>
                    <div id="hiddenTagsContainer"></div>
                    <div id="tagContainer" class="tag-container"></div>
                </div>
            </div>

            <div class="input-imagenes">
                <div class="input-cargarHecho">

                    <h4 th:if="${not #lists.isEmpty(hecho.contenidosMultimedia)}">Imágenes Actuales</h4>
                    <div class="contenedor-imagenes-existentes" id="contenedor-existentes">
                        <div th:each="url, iterStat : *{contenidosMultimedia}"
                             class="preview-item-existente"
                             th:id="'img-old-' + ${iterStat.index}"
                             th:data-url="${url}"> <img th:src="${url}" alt="Imagen existente">

                            <button type="button" class="remove-btn"
                                    th:onclick="'eliminarImagenExistente(' + ${iterStat.index} + ')'">×</button>
                        </div>
                    </div>

                    <div id="inputs-hidden-container"></div>

                    <label for="fotos" class="custom-file">Agregar nuevas imágenes 📷 </label>
                    <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
                    <div id="preview"></div> </div>
            </div>

            <div class="button-footer">
                <button class="btn-submit" type="submit">Solicitar modificación</button>
            </div>
        </div>
    </form>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const etiquetasExistentes = /*[[${hecho.etiquetas}]]*/ [];
        /*]]>*/
    </script>
</main>

<div id="mapa-input-ubicacion-container">
    <div id="mapa-input-ubicacion"></div>
    <div class="btn-container">
        <button type="button" class="btn-ubicacion" id="btn-cancel-ubicacion" onclick="toggleInputUbicacion(false)">Cancelar</button>
        <button type="button" class="btn-ubicacion hidden" id="btn-accept-ubicacion" onclick="seleccionarUbicacionActual()">Usar esta ubicación</button>
    </div>
</div>

<script>
    (() => {
        /*** CARGA DE FOTOS ***/
        const inputFotos = document.getElementById("fotos");
        const preview = document.getElementById("preview");
        let filesArray = [];
        /*
                    function agregarPathImagen(path) {
                        const index = document.querySelectorAll(".hidden-path").length;
                        const input = document.createElement("input");
                        input.type = "hidden";
                        input.name = `contenidosMultimedia[${index}]`;
                        input.value = path; // por ejemplo: "uploads/foto1.png"
                        input.classList.add("hidden-path");
                        document.getElementById("preview").appendChild(input);
                    }
        */
        function mostrarPreviews() {
            preview.innerHTML = "";
            filesArray.forEach((file, index) => {
                if (file.type.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const container = document.createElement("div");
                        container.classList.add("preview-item");

                        const img = document.createElement("img");
                        img.src = e.target.result;

                        const btn = document.createElement("button");
                        btn.textContent = "×";
                        btn.classList.add("remove-btn");
                        btn.onclick = (ev) => {
                            ev.preventDefault();
                            eliminarArchivo(index);
                        };

                        container.appendChild(img);
                        container.appendChild(btn);
                        preview.appendChild(container);
                    };
                    reader.readAsDataURL(file);
                }
            });

            const dataTransfer = new DataTransfer();
            filesArray.forEach(file => dataTransfer.items.add(file));
            inputFotos.files = dataTransfer.files;
        }

        function eliminarArchivo(index) {
            filesArray.splice(index, 1);
            mostrarPreviews();
        }

        if(inputFotos){
            inputFotos.addEventListener("change", () => {
                filesArray = filesArray.concat(Array.from(inputFotos.files));
                mostrarPreviews();
            });
        }

        const inputTags = document.getElementById("tagInput");
        const addBtn = document.getElementById("addTag");
        const tagContainer = document.getElementById("tagContainer");
        let etiquetas = [];

        function actualizarHidden() {
            const hiddenContainer = document.getElementById("hiddenTagsContainer");

            hiddenContainer.innerHTML = "";
            etiquetas.forEach((et, index) => {
                const hidden = document.createElement("input");
                hidden.type = "hidden";
                hidden.name = `etiquetas[${index}].nombre`;
                hidden.value = et;
                hidden.classList.add("hidden-tag");
                hiddenContainer.appendChild(hidden);
            });
        }
        function crearEtiqueta(texto) {
            const tagText = texto.trim();
            if (!tagText || etiquetas.includes(tagText)) return;
            etiquetas.push(tagText);
            actualizarHidden();
            const tag = document.createElement("div");
            tag.classList.add("tag");
            tag.textContent = tagText;
            const btn = document.createElement("button");
            btn.textContent = "×";
            btn.onclick = (e) => {
                e.preventDefault();
                etiquetas = etiquetas.filter(et => et !== tagText);
                actualizarHidden();
                tag.remove();
            };
            tag.appendChild(btn);
            tagContainer.appendChild(tag);
            inputTags.value = "";
        }
        addBtn.addEventListener("click", () => crearEtiqueta(inputTags.value));
        inputTags.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); crearEtiqueta(inputTags.value); }
        });
        function initEtiquetas() {
            if (typeof etiquetasExistentes !== 'undefined' && etiquetasExistentes) {
                etiquetasExistentes.forEach(etiquetaObjeto => {
                    if (etiquetaObjeto && etiquetaObjeto.nombre) {
                        crearEtiqueta(etiquetaObjeto.nombre);
                    }
                });
            }
        }
        initEtiquetas();
    })();


    const boundsArgentina = [ [-58.0, -80.0], [-20.0, -50.0] ];
    const allowedBounds = L.latLngBounds(boundsArgentina);

    let ubicacionSeleccionada;
    let markerUbicacionSeleccionada;
    let ultimaPosicionValida = null;
    let nombreUbicacionLegible = "";

    const inputUbicacionContainer = document.getElementById('mapa-input-ubicacion-container');
    const inputUbicacion = document.getElementById('ubicacion');
    const inputLat = document.getElementById("latitud");
    const inputLng = document.getElementById("longitud");

    const map = L.map('mapa-input-ubicacion', {
        center: [-34.5986333, -58.4199428],
        zoom: 5,
        minZoom: 4,
        maxBounds: boundsArgentina,
        maxBoundsViscosity: 1.0
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        noWrap: true
    }).addTo(map);

    async function marcarUbicacionActual(newUbicacion) {
        const lat = newUbicacion[0];
        const lng = newUbicacion[1];

        if (!allowedBounds.contains(newUbicacion)) {
            alert("Estás muy lejos de la zona permitida.");
            return;
        }

        document.body.style.cursor = 'wait';

        const resultado = await LocationService.obtenerDatosUbicacion(lat, lng);

        document.body.style.cursor = 'default';

        if (!resultado.valid) {
            alert("La ubicación seleccionada está fuera de la República Argentina.");
            if (markerUbicacionSeleccionada && ultimaPosicionValida) {
                markerUbicacionSeleccionada.setLatLng(ultimaPosicionValida);
            }
            return;
        }

        ultimaPosicionValida = [lat, lng];
        nombreUbicacionLegible = resultado.label;

        if (markerUbicacionSeleccionada) {
            markerUbicacionSeleccionada.setLatLng([lat, lng]);
        } else {
            markerUbicacionSeleccionada = L.marker([lat, lng], {
                riseOnHover: true,
                draggable: true
            }).addTo(map);

            markerUbicacionSeleccionada.on('dragend', async function(e) {
                const pos = e.target.getLatLng();
                await marcarUbicacionActual([pos.lat, pos.lng]);
            });
        }

        markerUbicacionSeleccionada.bindPopup(`<b>${nombreUbicacionLegible}</b>`).openPopup();
        document.getElementById('btn-accept-ubicacion').classList.remove('hidden');
    }

    map.on('contextmenu', (e) => {
        marcarUbicacionActual([e.latlng.lat, e.latlng.lng]);
    });

    const geocoder = new L.Control.Geocoder({
        defaultMarkGeocode: false,
        geocoder: L.Control.Geocoder.nominatim({
            geocodingQueryParams: { countrycodes: 'ar' }
        })
    })
        .on('markgeocode', async (e) => {
            const coords = e.geocode.center;
            map.setView(coords, 13);
            await marcarUbicacionActual([coords.lat, coords.lng]);
        })
        .addTo(map);

    function toggleInputUbicacion(active) {
        inputUbicacionContainer.classList.toggle('active', active);
        if (active) {
            setTimeout(() => { map.invalidateSize(); }, 100);
            if (ubicacionSeleccionada) {
                marcarUbicacionActual(ubicacionSeleccionada);
            }
        }
    }

    async function seleccionarUbicacionActual() {
        if (markerUbicacionSeleccionada) {
            const lat = markerUbicacionSeleccionada.getLatLng().lat;
            const lng = markerUbicacionSeleccionada.getLatLng().lng;

            const resultado = await LocationService.obtenerDatosUbicacion(lat, lng);
            if (!resultado.valid) {
                alert("Ubicación inválida.");
                return;
            }

            ubicacionSeleccionada = [lat, lng];

            inputUbicacion.value = resultado.label;
            inputLat.value = lat;
            inputLng.value = lng;
        }
        toggleInputUbicacion(false);
    }

    (function cargarUbicacionInicial() {
        const latInicial = parseFloat(inputLat.value);
        const lngInicial = parseFloat(inputLng.value);

        if (!isNaN(latInicial) && !isNaN(lngInicial)) {
            ubicacionSeleccionada = [latInicial, lngInicial];
            ultimaPosicionValida = [latInicial, lngInicial];

            inputUbicacion.placeholder = "Obteniendo ubicación...";
            LocationService.obtenerDatosUbicacion(latInicial, lngInicial).then(res => {
                if (res.valid) {
                    inputUbicacion.value = res.label;
                    nombreUbicacionLegible = res.label;
                } else {
                    inputUbicacion.value = `${latInicial.toFixed(4)}, ${lngInicial.toFixed(4)}`;
                }
            });

            markerUbicacionSeleccionada = L.marker([latInicial, lngInicial], {
                riseOnHover: true,
                draggable: true
            }).addTo(map);

            markerUbicacionSeleccionada.on('dragend', async function(e) {
                const pos = e.target.getLatLng();
                await marcarUbicacionActual([pos.lat, pos.lng]);
            });

            map.setView([latInicial, lngInicial], 13);

            document.getElementById('btn-accept-ubicacion').classList.remove('hidden');
        }
    })();

    const formulario = document.querySelector('.solicitar-modificacion-form');

    formulario.addEventListener('submit', function(event) {
        const containerInputs = document.getElementById('inputs-hidden-container');
        const imagenesVivas = document.querySelectorAll('.preview-item-existente');

        containerInputs.innerHTML = '';

        imagenesVivas.forEach((div, index) => {
            const url = div.getAttribute('data-url');
            if (url) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'contenidosMultimedia';
                input.value = url;
                containerInputs.appendChild(input);
            }
        });
    });
    function eliminarImagenExistente(index) {
        const elemento = document.getElementById('img-old-' + index);
        if (elemento) {
            elemento.remove();
        }
    }

</script>
</body>
</html>
