<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis-Hechos | METAmapa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
    <style>
        html{
            height: 100%;
        }
        body {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
        }

        .sidebar {
            width: 20%;
            display: flex;
            flex-direction: column;
            background: var(--color-secondary);
            padding: 10px;
            box-shadow: 10px 0px 20px 0px rgba(126, 124, 124, 0.07) inset;
        }

        .sidebar h2{
            align-self: center;
            font-family: "Londrina Solid"; /*Todo cambiar el tipo de letra como el de metamapa */
            font-weight: bolder;
        }

        .separator{
            border: none;
            border-top: 2px solid #444;
            margin: 10px 0;
            width: 100%;
        }

        .filtro-container{
            width: 100%;
            height: 100%;
            padding: 1em;
            display: flex;
            flex-direction: column;
            gap: 1em;
        }

        .filtro{
            background: var(--color-secondary-2);
            border: none;
            border-radius: 20px;
            padding: 0.5em;
            font-size: medium;
        }

        .aplicar-filtros-button{
            align-content: center;
            align-self: flex-end;
            display: inline;
            padding: 6px;
            background: var(--color-main-2);
            border: none;
            border-radius: 4px;
            font-size: large;
            font-weight: bold;
            cursor: pointer;
        }

        .aplicar-filtros-button:hover{
            background: var(--color-secondary-2-hover);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--color-secondary-2);
            padding: 0.5rem;
            border-radius: 20px;
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 1rem;
            margin-left: 0.5rem;
        }

        .card h3 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: "sans-serif";
        }

        .icon-button {
            background: transparent;
            border: none;
            cursor: pointer;
            align-self: flex-end;
            font-size: 2rem;
            margin-top: 1.5rem;
        }

        .icon-button i {
            pointer-events: none;
        }

        .icon-button:hover{
            color: gray;
        }

        .card-container {
            display: flex;
            gap: 1.5rem; /* Aumentar la separación entre tarjetas */
            flex-wrap: wrap;
            background: var(--color-secondary);
            padding: 1rem;
            border-radius: 4px;
            box-shadow: 10px 10px 30px 30px rgba(126, 124, 124, 0.07) inset;
        }

        .card {
            background: #e8ffe8; /* Fondo más claro o blanco */
            border: 1px solid #c8ecc8; /* Borde sutil */
            border-left: 5px solid #4CAF50; /* Línea de acento verde */
            border-radius: 8px; /* Bordes más redondeados */
            padding: 0.8rem; /* Más espacio interno */
            height: auto; /* Dejar que el contenido defina la altura */
            min-width: 260px;
            max-width: 280px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Sombra para profundidad */
            transition: transform 0.2s;
            overflow: visible; /* Importante para la sombra */
        }

        .card:hover {
            transform: translateY(-5px); /* Efecto al pasar el ratón */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #00796b; /* Color del texto del título más profesional */
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 13px;
            color: #444;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }

        .icon-button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: #00796b;
            padding: 0;
            line-height: 1;
        }

        .icon-button:hover{
            color: #4CAF50;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 2rem;
            margin-bottom: 1rem;
            gap: 10px;
        }

        .pagination-button {
            padding: 8px 15px;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            background-color: white;
            color: #4CAF50;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-weight: bold;
        }

        .pagination-button:hover:not(.disabled) {
            background-color: #f1f8e9; /* Un verde muy claro */
        }

        .pagination-button.active {
            background-color: #4CAF50;
            color: white;
        }

        .pagination-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Mis hechos</h2>

        <hr class="separator">

        <div>
            <h5><i class="fa-solid fa-filter" style="margin-right: 0.5rem"></i>Filtros Recientes</h5>
            <div class="filtro-container">
                <button class="filtro">
                    unTítulo: Valor
                </button>
            </div>
        </div>

        <hr class="separator">

        <div class="filtro-container">
            <div class="filtro">
                unFiltro: Valor
            </div>
            <button class="aplicar-filtros-button">
                Aplicar Filtros
            </button>
        </div>

    </aside>
    <main class="main">
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar Hechos...">
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="width: 100%; margin-bottom: 1rem; color: red;"></div>

        <div class="card-container">

            <div th:if="${hechosPage == null or hechosPage.totalElements == 0}" class="alert alert-info" style="width: 100%; text-align: center; color: #333;">
                <i class="fa-solid fa-circle-info"></i> Aún no has registrado ningún hecho.
            </div>

            <div class="card" th:each="hecho : ${hechosPage.content}">

                <h3 th:text="${hecho.titulo}">Titular Destacado</h3>

                <p th:text="${hecho.descripcion}">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras metus.</p>

                <div style="font-size: 12px; opacity: 0.7;">
                    Fecha: <span th:text="${#temporals.format(hecho.fechaHecho, 'dd/MM/yyyy HH:mm')}">15/05/2025</span>

                    <th:block th:if="${hecho.categoria != null}">
                        | Categoría: <span th:text="${hecho.categoria.nombre}">Vialidad</span>
                    </th:block>
                </div>

                <div class="card-actions">

                    <a th:href="@{/hechos/detalle-hecho/{id}(id=${hecho.id})}" class="icon-button view-button" title="Ver detalle del hecho">
                        <i class="fa-solid fa-eye"></i>
                    </a>

                    <a th:href="@{/api/solicitudes/modificacion/{id_hecho}(id_hecho=${hecho.id})}" class="icon-button edit-button" title="Crear solicitud de modificación">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </a>

                </div>
            </div>
        </div>
        <div class="pagination-container" th:if="${hechosPage != null and hechosPage.totalPages > 1}">

            <a th:href="@{/hechos/mis-hechos(page=${hechosPage.number - 1}, size=${hechosPage.size})}"
               th:classappend="${hechosPage.first} ? 'disabled'"
               class="pagination-button"
               title="Página Anterior">
                <i class="fa-solid fa-chevron-left"></i> Anterior
            </a>

            <th:block th:with="currentPage=${hechosPage.number}, totalPages=${hechosPage.totalPages}">
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i < 3 or (i >= currentPage - 2 and i <= currentPage + 2) or i >= totalPages - 3}"
                       th:href="@{/hechos/mis-hechos(page=${i}, size=${hechosPage.size})}"
                       th:classappend="${i == currentPage} ? 'active'"
                       class="pagination-button"
                       th:text="${i + 1}">1</a>

                    <span th:if="${(i == 3 and currentPage > 4) or (i == totalPages - 3 and currentPage < totalPages - 5)}" th:text="..."></span>
                </th:block>
            </th:block>

            <a th:href="@{/hechos/mis-hechos(page=${hechosPage.number + 1}, size=${hechosPage.size})}"
               th:classappend="${hechosPage.last} ? 'disabled'"
               class="pagination-button"
               title="Página Siguiente">
                Siguiente <i class="fa-solid fa-chevron-right"></i>
            </a>

        </div>

        </div>
    </main>
</body>

<script>
</script>
</html>
