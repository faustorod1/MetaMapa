<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Importar CSV | METAmapa</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet"> <!-- tipografia logo -->
    <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script> <!-- para la flechita de volver a la pag anterior-->

    <style>
      body {
        height: 100vh;
        margin:0;
        background-image:url('/fondoLevementeCargado.png');
        background-attachment: fixed;
        background-position: center center;
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
      }

      h2{
          margin-bottom:0.2rem;
      }

      .csv-import-container {
        width: 50rem;
        margin: auto;
        padding: 0.8rem;
        border: 2px solid #ccc;
        border-radius: 1rem;
        background-color: var(--color-main);
      }

      .drop-zone {
            border: 0.1rem dashed #aaa;
          display:flex;
          border-radius: 0.5rem;
            padding: 2rem;
            align-items: center;
          justify-content: center;
          gap:0.5rem;
          text-align: center;
        cursor: pointer;
        background-color: #f0eded;
      }


      .file-list {
        list-style: none;
        padding: 0;
        margin-bottom: 10px;
      }

      .file-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #eee;
        margin: 5px 0;
        padding: 5px 10px;
        border-radius: 4px;
        position: relative;
      }


      .file-list li span {
        flex-grow: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-list li button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        visibility: hidden;
        transition: visibility 0.2s ease-in-out;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .file-list li:hover button {
        visibility: visible;
      }

      .file-list li button:hover svg path {
        fill: #a00;
      }

      .file-list li svg {
        pointer-events: none;
        width: 16px;
        height: 16px;
      }

      .actions {
        display: flex;
        justify-content: space-between;
      }

      .btn-submit{
          font-size: 1rem;
          text-decoration: none;
          padding: 0.5em;
          border-radius: 2em;
          color: black;
          font-weight: bold;
          cursor: pointer;
          background-color: var(--color-main-2);
      }

      #btn-ok{
          width:4rem;
          border: none;
      }

      #btn-cancelar{
          border:none;
      }

      .btn-buscar{
          font-size: 1rem;
          padding:0.2rem;
          border-radius:0.3rem;
          background-color: var(--color-main-2);
      }

      .btn-submit:hover {
          background-color: var(--color-main-2-hover);
      }

      .btn-buscar:hover {
          background-color: var(--color-main-2-hover);
      }

    </style>
</head>
<body>
<main>
    <a th:href="@{/main}" id="btn-back-page"><i class="fa-solid fa-chevron-left"></i></a>
  <div id="fixed-logo"></div>

  <div class="csv-import-container"><h2 style="color: white;">Importar archivo CSV</h2>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"
           style="margin-bottom: 20px; padding: 10px; border: 1px solid red; background-color: #f8d7da; color: #721c24;">
      </div>

      <div th:if="${exito}" class="alert alert-success" th:text="${exito}"
           style="margin-bottom: 20px; padding: 10px; border: 1px ;background-color: #d4edda; color: #155724;">
      </div>


      <div class="drop-zone" id="dropZone">
          <p>Arrastrá tus archivos aquí o</p>
          <input type="file" id="fileInput" multiple accept=".csv" hidden />
          <button type="button" class="btn-buscar" onclick="document.getElementById('fileInput').click()">Buscar</button>
      </div>

      <!-- Este es el ÚNICO form con th:action -->
      <form th:action="@{/hechos/importar}" method="post" enctype="multipart/form-data" id="uploadForm">
          <input type="file" name="files" multiple accept=".csv" hidden />
      </form>

      <ul id="fileList" class="file-list"></ul>

      <div class="actions">
          <button class="btn-submit" type="button" id="btn-cancelar" onclick="cancelar()">Cancelar</button>
          <button class="btn-submit" type="button" id="btn-ok" onclick="confirmar()">OK</button>
      </div>
  </div>
</main>

      <script>
          const dropZone = document.getElementById('dropZone');
          const fileInput = document.getElementById('fileInput');
          const fileList = document.getElementById('fileList');
          let archivos = [];

          // --- Estilos visuales del drag & drop ---
          dropZone.addEventListener('dragover', e => {
              e.preventDefault();
              dropZone.style.backgroundColor = '#e0f7fa';
          });

          dropZone.addEventListener('dragleave', () => {
              dropZone.style.backgroundColor = '#fff';
          });

          dropZone.addEventListener('drop', e => {
              e.preventDefault();
              dropZone.style.backgroundColor = '#fff';
              manejarArchivos(e.dataTransfer.files);
          });

          fileInput.addEventListener('change', () => {
              manejarArchivos(fileInput.files);
          });

          // --- Manejo de archivos en memoria ---
          function manejarArchivos(files) {
              for (let file of files) {
                  if (file.name.endsWith('.csv')) {
                      archivos.push(file);
                  }
              }
              actualizarLista();
          }

          function actualizarLista() {
              fileList.innerHTML = '';
              archivos.forEach((file, index) => {
                  const li = document.createElement('li');

                  const spanNombre = document.createElement('span');
                  spanNombre.textContent = file.name;

                  const btnEliminar = document.createElement('button');
                  btnEliminar.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
                  btnEliminar.title = "Eliminar archivo";
                  btnEliminar.onclick = () => {
                      archivos.splice(index, 1);
                      actualizarLista();
                  };

                  li.appendChild(spanNombre);
                  li.appendChild(btnEliminar);
                  fileList.appendChild(li);
              });
          }

          function cancelar() {
              archivos = [];
              actualizarLista();
              alert('Importación cancelada.');
          }

          // --- Envío del formulario ---
          function confirmar() {
              if (archivos.length === 0) {
                  alert('No hay archivos para importar.');
                  return;
              }

              // Transferir los archivos seleccionados al input del formulario
              const dataTransfer = new DataTransfer();
              archivos.forEach(file => dataTransfer.items.add(file));

              const inputForm = document.querySelector('#uploadForm input[name="files"]');
              inputForm.files = dataTransfer.files;

              // Enviar el formulario (POST a hechos/importar)
              document.getElementById('uploadForm').submit();
          }
      </script>
</body>
</html>
