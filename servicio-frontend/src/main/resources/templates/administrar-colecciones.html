<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Administrar Colecciones | METAmapa</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <script src="https://kit.fontawesome.com/f5394feeef.js" crossorigin="anonymous"></script>
  <style>
    html{
      height: 100%;
    }
    body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      display: flex;
      /* Se asume que este es el fondo levemente cargado */
      background-image: url('/fondoLevementeCargado.png');
      background-attachment: fixed;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* 3) Separación del Contenedor General del Margen Izquierdo */
    .main-container {
      padding: 1rem;
      height: 95%;
      width: 95%;
      /* Asumido color secundario */
      background: var(--color-secondary);
      border-radius: 6px;
      /* Margen ajustado para separación izquierda */
      margin: 1.5rem 1rem 1rem 1rem;
      max-width: 1200px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .header h2 {
      color: black;
      text-align: center;
      width: 100%;
      margin-bottom: 0;
    }

    .search-bar {
      display: flex;
      align-items: center;
      /* Asumido color secundario 2 */
      background: var(--color-secondary-2);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      height: 2.2rem;
    }

    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 1rem;
      margin-left: 0.5rem;
      /* Asumido color principal 2 */
      color: var(--color-main-2);
      height: 100%;
    }

    .collection {
      /* Asumido color principal (azul oscuro/morado) */
      background: var(--color-main);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 1) Color Blanco para todo el texto y 2) Layout de 2 Filas (Flexbox) */
    .collection-info {
      color: white; /* Color del texto base */
      flex-grow: 1;

      /* Flexbox para layout de 2 columnas por fila */
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    /* Título de Colección Centrado y ocupando todo el ancho */
    .collection-info h3 {
      color: white;
      text-align: center;
      width: 100%; /* Ocupa toda la fila */
      margin: 0 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5); /* Separador blanco */
    }

    /* Cada campo (p) ocupa la mitad del ancho para crear dos columnas */
    .collection-info p {
      width: 48%;
      color: white;
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      /* Aseguramos que los valores se alineen bien en la izquierda de su espacio */
      text-align: left;
    }

    .collection-info p strong {
      color: white;
      white-space: nowrap;
    }

    .collection-info p span {
      color: white;
    }

    /* Se mantiene .collection-actions para los botones */
    .collection-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
      /* Asumido color principal 2 (verde) */
      background: var(--color-main-2);
      padding: 0.5rem;
      border-radius: 12px;
    }

    /* Estilo para los botones de acción (aplicable a <a> y <button>) */
    .collection-actions button {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .collection-actions a button:hover,
    .collection-actions button:hover {
      /* Asumido color hover */
      color: var(--color-main-2-hover);
    }

    .collection-actions a {
      text-decoration: none;
    }

    .separator{
      border: none;
      border-top: 2px solid #444;
      margin: 10px;
      width: 100%;
      align-self: center;
    }

    .btn-add {
      border-radius: 2em;
      font-size: 2rem;
      font-weight: 900;
      /* Asumido color principal 2 */
      background: var(--color-main-2);
      color: white;
      width: 2em;
      height: 2em;
      aspect-ratio: 1;
      border: none;
    }
    .btn-add:hover {
      background-color: var(--color-main-2-hover);
      cursor: pointer;
    }
    #btn-add {
      position: fixed;
      right: 4rem;
      bottom: 2rem;
      z-index: 1000;
    }

  </style>
</head>
<body>
<div class="main-container">
  <div class="header">
    <h2>Colecciones</h2>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Buscar Colección">
    </div>
  </div>
  <hr class="separator">

  <div th:each="coleccion : ${colecciones}" class="collection">
    <div class="collection-info">
      <h3 th:text="${coleccion.titulo}">Nombre de Colección</h3>

      <p><strong>Identificador:</strong> <span th:text="${coleccion.identificador}">ID-001</span></p>
      <p><strong>Descripción:</strong> <span th:text="${coleccion.descripcion}">Texto de descripción</span> </p>

      <p><strong>Algoritmo de Consenso:</strong> <span th:text="${coleccion.algoritmoDeConsenso}">Mayoria simple</span> </p>
      <p><strong>Fuentes:</strong>
        <span th:text="${#strings.listJoin(coleccion.fuentes.![tipoDeFuente.toString()], ', ')}">Proxy, Estática</span>
      </p>
    </div>

    <div class="collection-actions">
      <button title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
      <button title="Eliminar"><i class="fa-solid fa-trash"></i></button>

      <a th:href="@{/colecciones/detalle/{id}(id=${coleccion.identificador})}" title="Detalle" style="display: block;">
        <button><i class="fa-solid fa-arrow-right"></i></button>
      </a>
    </div>
  </div>

</div>
</body>
</html>
